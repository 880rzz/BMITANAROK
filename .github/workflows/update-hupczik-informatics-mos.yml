name: Update Hupczik Andrea profile text

on:
  push:
    paths:
      - '.github/workflows/update-hupczik-informatics-mos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove informatics references from profile narrative
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "Informatikatanár, hagyományőrző közösségi szervező és két fiúgyermek édesanyja vagyok. A magyar hagyományokat közösségi élménnyé szeretném tenni, miközben digitális és informatikai tudást is átadok.":
              "Informatikatanár, hagyományőrző közösségi szervező és két fiúgyermek édesanyja vagyok. A magyar hagyományokat közösségi élménnyé szeretném tenni.",

              "A közösségi dobolás, az ének, a magyar mondavilág és hagyományőrzés, a generációk közötti kapcsolódás, valamint az informatika és digitális készségfejlesztés áll hozzám közel.":
              "A közösségi dobolás, az ének, a magyar mondavilág és hagyományőrzés, valamint a generációk közötti kapcsolódás áll hozzám közel.",
          }

          files = [Path("index.html"), Path("teacher-knowledge.json"), Path("teacher-catalog.jsonld")]
          changed = []

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Defensive partial replacements for machine-readable copies or minor formatting variants.
              text = text.replace(", miközben digitális és informatikai tudást is átadok.", ".")
              text = text.replace(", valamint az informatika és digitális készségfejlesztés áll hozzám közel.", " áll hozzám közel.")

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise SystemExit("No matching Hupczik Andrea text found to update")

          print("Updated:", ", ".join(changed))

      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html teacher-knowledge.json teacher-catalog.jsonld
          git diff --cached --quiet && exit 0
          git commit -m "Refine Hupczik Andrea profile narrative"
          git push
