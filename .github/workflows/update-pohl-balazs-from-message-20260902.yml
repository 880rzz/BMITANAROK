name: Update Pohl Balazs from submitted text 20260902

on:
  push:
    paths:
      - '.github/workflows/update-pohl-balazs-from-message-20260902.yml'
      - 'tools/update_pohl_balazs_from_20260902_message.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply submitted wording
        run: python3 tools/update_pohl_balazs_from_20260902_message.py
      - name: Rebuild teacher knowledge
        run: |
          if [ -f tools/build_teacher_knowledge.py ]; then python3 tools/build_teacher_knowledge.py; fi
      - name: Validate Pohl profile
        run: |
          grep -Fq 'Waldorf-tanári, drámapedagógusi és színházi tapasztalatokkal felvértezve' index.html
          grep -Fq 'szabad, önálló gondolkodásra, véleményformálásra ösztönzését' index.html
          grep -Fq 'Mindezt a drámapedagógia és a színház eszközeivel kívánjuk elérni.' index.html
          grep -Fq 'Gimi-Svung' index.html
          grep -Fq 'pohl-balazs' teacher-knowledge.json
      - name: Commit
        run: |
          git config user.name "bmi-teacher-steward[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms-full.txt teacher-knowledge.json teacher-catalog.jsonld 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update Pohl Balazs profile from his submitted text"
          git push
