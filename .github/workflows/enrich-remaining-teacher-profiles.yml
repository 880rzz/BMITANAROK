name: Enrich remaining teacher profiles

on:
  push:
    paths:
      - '.github/workflows/enrich-remaining-teacher-profiles.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update researched profiles
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          articles = {
          'noszko-niki': '''<article class="profile" id="noszko-niki"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Pszichológus · gyermekpszichodráma-csoportvezető · óvodai foglalkozásvezető</div><h2>Noszkó Niki</h2><p class="role">Pszichológusként a játék, a fantázia és a biztonságos csoport erejére épít. A Bécsi Magyar Iskolában óvodai foglalkozást vezet, emellett gyermekpszichodráma-csoportokkal is dolgozik.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/ovoda-2026" target="_blank" rel="noopener">Bécsi Magyar Óvoda</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>2007-ben végzett pszichológia szakon, 2011 óta foglalkozik pszichodrámával. A gyermekpszichodráma módszerét Kende B. Hanna szakmai iskolájához kapcsolódó képzésben sajátította el. Bécsben gyermekpszichodráma-bemutatókat és csoportokat is vezetett, az AMAPED iskolaérettséggel foglalkozó előadássorozatában pedig pszichológusként szerepelt. A Bécsi Magyar Óvoda foglalkozásvezetője Bajka Kinga Csengele mellett.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A gyermekpszichodráma, az érzelmi biztonság, a játék és a fantázia, az önbizalom, a konfliktusok és a szorongások feldolgozása, valamint az a folyamat, amelyben a gyerekek szimbólumokon és saját történeteken keresztül tudják megmutatni belső világukat.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>Fontosnak tartja a kiszámítható, biztonságos csoportot, ahol a gyerekek idővel mernek saját történeteket és érzéseket behozni. A játék nála nem „jutalom”, hanem maga a munka nyelve: ezen keresztül lehet gyakorolni a kapcsolódást, a határok felismerését, az erőszakmentes önérvényesítést és azt is, hogyan tud egy gyermek egy nehéz élményt másképp elmesélni.</p></section></div></article>''',
          'hupczik-andrea': '''<article class="profile" id="hupczik-andrea"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Hagyományőrző közösségi szervező · bécsi kapcsolattartó</div><h2>Hupczik Andrea</h2><p class="role">A magyar hagyományőrzést közös élménnyé teszi: a dob, az ének, a ritmus és a közösségi jelenlét egyszerre kap helyet a bécsi programokban.</p><div class="programs"><a href="https://taltosdob.magyariskola.at" target="_blank" rel="noopener">Világfa Sárkányai</a><a href="https://www.magyariskola.at/event-details/oromzene-2026" target="_blank" rel="noopener">Együtt dobban Bécs</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Regélő Fehér Táltos Hagyományőrző Egyesület bécsi kapcsolattartója és a Bécsi Magyar Iskolához kapcsolódó dobos-hagyományőrző programok egyik helyi szervezője. Az Együtt dobban Bécs programban a 2007 óta működő hagyományőrző dobcsapat szakmai közösségét kapcsolja össze a bécsi résztvevőkkel; a program gyerekeket, családokat, fiatalokat és felnőtteket is megszólít.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A közösségi dobolás, az ének, a magyar mondavilág és hagyományőrzés, a generációk közötti kapcsolódás, valamint az a közösségi forma, ahol a magyar kultúrát nem csak elmesélik, hanem együtt meg is élik.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A programok egyik fontos alapelve, hogy nem kell előzetes zenei vagy dobos tudás. A résztvevők egymásra figyelve tanulnak ritmust tartani, vezetni és alkalmazkodni. A közös zenélés így egyszerre fejleszti a figyelmet, az együttműködést és a közösséghez tartozás élményét; a szülők pedig nem csak kísérők, hanem a gyerekekkel együtt is bekapcsolódhatnak.</p></section></div></article>''',
          'varga-bernadette': '''<article class="profile" id="varga-bernadette"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptánc-foglalkozásvezető · közösségi szervező · népzenész</div><h2>Varga Bernadette</h2><p class="role">A néptáncot és a népzenét gyerekkora óta közösségi élményként éli meg, és ugyanezt a természetességet adja tovább a Napraforgócskák gyerekcsoportjában.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#napraforgocskak" target="_blank" rel="noopener">Napraforgócskák</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Óvodás kora óta kötődik a bécsi magyar táncházi közeghez. A Napraforgóknál táncosként és szervezőként is aktív, 2023 óta Veres Tamással közösen vezeti a Napraforgócskák gyermekcsoportot. A gyerekek saját házi zenekarában brácsán is közreműködik.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc és népzene, a gyerekekkel végzett közösségi munka, a felcsíki és más tájegységek táncanyaga, a népdal, a csujjogatás és az élő zenei kíséret. Számára a tánc családi és közösségi kötődés is.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A Napraforgócskákban játékosan, de komolyan dolgoznak: a gyerekek nemcsak lépéseket tanulnak, hanem dalokat, ritmust, hagyományt és színpadi jelenlétet is. A cél, hogy a magyar kultúra ne külön „tananyag” legyen, hanem olyan közös élmény, amelyhez a gyerekek örömmel kapcsolódnak.</p></section></div></article>''',
          'veres-tamas': '''<article class="profile" id="veres-tamas"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptánc-foglalkozásvezető · népzenész</div><h2>Veres Tamás</h2><p class="role">Hatéves kora óta néptáncol, és a táncot ma is olyan élő közösségi nyelvnek tekinti, amelyet gyerekekkel ugyanúgy lehet örömmel megszerettetni, mint felnőttekkel.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#napraforgocskak" target="_blank" rel="noopener">Napraforgócskák</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Hatévesen kezdett néptáncolni Gyöngyösön, a Tomory Gábor Néptánciskolában, amelynek egyetemista koráig tagja volt. Bécsbe költözése után csatlakozott a Napraforgókhoz, majd 2023-tól Varga Bernadette-tel közösen átvette a Napraforgócskák gyermekcsoport vezetését. A gyerekcsoport házi zenekarában ütőgardonon is játszik.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc, a közösségi táncház, a gyermek-néptáncoktatás, a ritmus és az élő népzene. A tánc számára nem időszakos hobbi, hanem olyan állandó közeg, amelyet új városban is ösztönösen keresett.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>Gyerekekkel játékos, közvetlen légkörben dolgozik. A Napraforgócskák próbáin a tánclépések mellett népdalok, játékok, csujjogatások és közös színpadi feladatok is helyet kapnak. A közösségben fontos az egymásra figyelés és az, hogy a gyerekek a hagyományt ne kötelességként, hanem saját élményként vigyék tovább.</p></section></div></article>''',
          'balogh-david': '''<article class="profile" id="balogh-david"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Művészettörténész · muzeológus · kurátor · fotográfiai foglalkozásvezető</div><h2>Balogh Dávid</h2><p class="role">A fotográfiát művészettörténeti és muzeológiai nézőpontból közelíti meg: nemcsak azt nézi, hogyan készült egy kép, hanem azt is, milyen korszakból, gondolkodásból és történetből érkezik.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/fotoklub-2026" target="_blank" rel="noopener">VIPACH Felnőtt Fotóklub</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Művészettörténész és muzeológus, helytörténeti kutatással és muzeális örökséggel is foglalkozik. 2018-tól a Fóti Értéktár Bizottság munkájában is részt vett, és a Németh Kálmán Emlékház vezetőjeként, illetve szakmai programjainak előadójaként dolgozott. A VIPACH művészeti vezetője, a közösségi fotókiállítások – köztük az Életem képe és az As I Like It – kurátora, valamint Bánhalmi Norberttel közösen vezeti a VIPACH Felnőtt Fotóklubot.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A művészettörténet, muzeológia, helytörténet, vizuális örökség, kiállításrendezés és a fotográfia története. Különösen az érdekli, hogyan lehet egy képet a saját korában és kulturális összefüggéseiben is olvasni, nem csak technikai teljesítményként nézni.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A fotóklubban a nagy fotográfusok látásmódját nem másolandó receptként, hanem kiindulópontként használja. A művészettörténeti háttér, a képelemzés és a saját fotós gyakorlat egymást erősíti; a cél, hogy a résztvevők történetet tudjanak mesélni akár fényképezőgéppel, akár egy telefonnal, és közben kialakuljon a saját vizuális ítélőképességük.</p></section></div></article>''',
          'sipos-tibor': '''<article class="profile" id="sipos-tibor"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptánc-foglalkozásvezető · hagyományőrző</div><h2>Sipos Tibor</h2><p class="role">A néptáncot a hagyomány egészével együtt adja tovább: a mozgás mellett a kézművesség, a közösségi élmény és a magyar népi kultúra más rétegei is fontosak számára.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#kezdocsoport" target="_blank" rel="noopener">Kezdő néptánc felnőtteknek</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Napraforgók Bécsi Magyar Néptánc és Népzene Egyesület aktív tagja. Az ORF már 2022-ben a néptáncegyüttes tagjaként és gyermekprogramok közreműködőjeként mutatta be. Jelenleg Orbán Dalmával közösen vezeti a Napraforgók kezdő felnőtt csoportját a Bécsi Magyar Iskolában.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc, a hagyományőrzés, a kezdők bevezetése a táncház világába és a népi kultúrához kapcsolódó kézműves tevékenységek. Gyermekprogramon bőrműves feladatot is vezetett, mert a tánclépések mellett a kézügyesség fejlesztését is értéknek tartja.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A kezdő csoport kortól, nemtől és előzetes tánctudástól függetlenül várja a résztvevőket. A tanulás az első lépésektől indul, közösségi tempóban, úgy, hogy a tánc ne teljesítményhelyzet, hanem belépési pont legyen a magyar népi kultúrába.</p></section></div></article>''',
          'orban-dalma': '''<article class="profile" id="orban-dalma"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptánc-foglalkozásvezető · táborvezető</div><h2>Orbán Dalma</h2><p class="role">Gyerekekkel és felnőtt kezdőkkel is dolgozik; számára a jó néptáncóra nem előre mereven rögzített program, hanem a csoport tudásához és tempójához igazodó közös munka.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#kezdocsoport" target="_blank" rel="noopener">Kezdő néptánc felnőtteknek</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Napraforgók tagjaként több korosztállyal dolgozott. 2022-ben Kelemen Rékával új bécsi gyermekcsoportok indításában vett részt, 2026-ban pedig Veres Tamással a Bécsi Magyar Iskolaegyesület nyári néptánctáborát vezette. Jelenleg Sipos Tiborral közösen tartja a Napraforgók kezdő felnőtt csoportját.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc, népdal és népi játék, a moldvai és nyárádmenti táncanyag, valamint az a közösségi tanulás, ahol kezdők is biztonsággal bekapcsolódhatnak.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A tananyagot a konkrét csoporthoz igazítja. Egy nyári tábor kapcsán úgy fogalmazott: előre megvan a program váza, de a részletekben rugalmasnak kell maradni, mert nem lehet előre tudni, milyen összetételű és tempójú csoport érkezik. Ha gyorsan megy egy tánc, tovább lehet lépni; ha több idő kell, ismételnek. Ez a figyelem a kezdő felnőtt csoportban is fontos alapelv.</p></section></div></article>''',
          'dapin-hajnalka-judit': '''<article class="profile" id="dapin-hajnalka-judit"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Zenepedagógus · zeneterapeuta · népzenész</div><h2>Mag. Dapin Hajnalka Judit</h2><p class="role">A zenét egyszerre használja pedagógiai, közösségi és terápiás térként; munkájában a népzene, az ének és a hangszeres játék természetesen találkozik a zeneterápia szemléletével.</p><div class="programs"><a href="https://zenebona.magyariskola.at" target="_blank" rel="noopener">Zenebona</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Zenepedagógusi tanulmányokat Romániában, Németországban és Ausztriában végzett, majd a bécsi Universität für Musik und darstellende Kunst zeneterápia szakán szerzett diplomát. 2025-ben beadott diplomamunkájában egy romániai kórház ápolói számára szervezett, COVID-időszak alatti preventív csoportos zeneterápiás folyamatot vizsgált, külön figyelemmel a pszichés terhelésre és a burnout kérdésére. Bécsi kulturális programokon citerán, daf-on és énekesként is fellépett.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A zeneterápia, a csoportos zenélés, a magyar népdal, az ének, a citera és a ritmushangszerek, valamint az, hogyan tud a zene egyszerre kapcsolatot, önkifejezést és lelki tehermentesítést adni.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A zenét nem kizárólag teljesítményként kezeli. Közösségi munkáiban a közös éneklés és hangszeres játék kapcsolatot teremt a résztvevők között, miközben a zenei hagyomány személyes élménnyé válik. Zeneterápiás háttere miatt különösen fontos számára a figyelem, a csoportfolyamat és az, hogy a zene az adott emberhez és helyzethez tudjon kapcsolódni.</p></section></div></article>''',
          'pecze-adam': '''<article class="profile" id="pecze-adam"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Zongorista · zeneszerző · musical-foglalkozásvezető</div><h2>Pecze Ádám</h2><p class="role">A MaMUT Musical Stúdióban a zongora és a zeneszerzés oldaláról kapcsolódik a gyerekek színpadi munkájához, a közös alkotást és a zenei kreativitást erősítve.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/mammut-2026" target="_blank" rel="noopener">MaMUT Musical Stúdió</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Zongorista és zeneszerző, a Bécsi Magyar Musical Társulat csapatában a zongora és a zeneszerzés feladatait viszi. A budapesti Bartók Konzi növendékeként 2024-ben a Zeneakadémia Solti termében a végzős növendékek zenekarában zongorázott, 2025-ben pedig improvizációközpontú jazzprojektben is fellépett.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A zongora, a zeneszerzés, a jazz, az improvizáció és a musical zenei világa. Olyan helyzetekben dolgozik, ahol a zene nem különálló elem, hanem a történet, a karakter és a színpadi jelenlét része.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A MaMUT műhelyében a zenei fejlődés az önbizalommal, kreativitással, csapatmunkával és magyar nyelvű színpadi alkotással együtt történik. A zongorakíséret és a zeneszerzés így nem pusztán háttér, hanem olyan partner a próbafolyamatban, amely segíti a gyerekeket a ritmus, a dallam, az együttműködés és a színpadi figyelem megtapasztalásában.</p></section></div></article>'''
          }

          for aid, html in articles.items():
              pattern = rf'<article class="profile" id="{re.escape(aid)}">.*?</article>'
              s2, n = re.subn(pattern, html, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace profile {aid}: matches={n}')
              s = s2

          card_updates = {
              '<a class="teacher-card" href="#noszko-niki"><b>Noszkó Niki</b><span>Óvodai foglalkozások</span></a>': '<a class="teacher-card" href="#noszko-niki"><b>Noszkó Niki</b><span>Pszichológia · gyermekpszichodráma · óvoda</span></a>',
              '<a class="teacher-card" href="#hupczik-andrea"><b>Hupczik Andrea</b><span>Néphagyomány · dob · közösség</span></a>': '<a class="teacher-card" href="#hupczik-andrea"><b>Hupczik Andrea</b><span>Hagyományőrzés · közösségi dob · generációk</span></a>',
              '<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>Gyermek néptánc</span></a>': '<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>Gyermek néptánc · népzene · közösség</span></a>',
              '<a class="teacher-card" href="#veres-tamas"><b>Veres Tamás</b><span>Gyermek néptánc</span></a>': '<a class="teacher-card" href="#veres-tamas"><b>Veres Tamás</b><span>Gyermek néptánc · népzene · táncház</span></a>',
              '<a class="teacher-card" href="#balogh-david"><b>Balogh Dávid</b><span>Fotográfia · alkotói gyakorlat</span></a>': '<a class="teacher-card" href="#balogh-david"><b>Balogh Dávid</b><span>Művészettörténet · muzeológia · fotográfia</span></a>',
              '<a class="teacher-card" href="#sipos-tibor"><b>Sipos Tibor</b><span>Felnőtt néptánc</span></a>': '<a class="teacher-card" href="#sipos-tibor"><b>Sipos Tibor</b><span>Felnőtt néptánc · hagyományőrzés</span></a>',
