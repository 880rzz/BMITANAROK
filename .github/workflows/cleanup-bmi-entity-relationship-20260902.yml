name: Clean BMI teacher entity relationships
on:
  push:
    paths:
      - '.github/workflows/cleanup-bmi-entity-relationship-20260902.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize school entity and affiliation semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          allowed={'.html','.json','.jsonld','.js','.txt','.md','.yml','.yaml','.py'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in allowed or '.git' in p.parts:
                  continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              old=s
              s=s.replace('https://www.magyariskola.at/#org','https://www.magyariskola.at/#school')
              s=re.sub(r",\s*['\"]worksFor['\"]\s*:\s*\{['\"]@id['\"]\s*:\s*['\"]https://www\.magyariskola\.at/#school['\"]\s*\}", '', s)
              if s!=old: p.write_text(s,encoding='utf-8')
          # Hard regression contract: active public files must not imply employment.
          for name in ['index.html','teacher-knowledge.json','teacher-catalog.jsonld','llms.txt','llms-full.txt']:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  if 'worksFor' in s: raise SystemExit(f'Forbidden worksFor remains in {name}')
                  if 'https://www.magyariskola.at/#org' in s: raise SystemExit(f'Legacy #org remains in {name}')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "BMI Entity Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Normalize BMI teacher affiliation semantics"
          git push
