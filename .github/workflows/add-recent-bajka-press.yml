name: Add recent Bajka press
on:
  push:
    paths:
      - '.github/workflows/add-recent-bajka-press.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recent Rólunk article to Bajka profile
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          url='https://rolunk.at/fiatalok/allat-barat-ketnyelvu-tabor-a-becsi-magyar-iskolaban/'
          m=re.search(r'(<article class="profile" id="bajka-kinga-csengele">.*?</article>)',s,re.S)
          if not m: raise SystemExit('Bajka profile not found')
          art=m.group(1)
          if url not in art:
              card='<a class="press-card" href="'+url+'" target="_blank" rel="noopener"><span class="press-medium">Rólunk.at</span><strong>Állat/barát kétnyelvű tábor a Bécsi Magyar Iskolában</strong><span class="press-desc">Riport a Bajka Kinga Csengele által vezetett kétnyelvű, kreatív és közösségépítő nyári táborról.</span><span class="press-open">Cikk megnyitása →</span></a>'
              gm=re.search(r'(<div class="press-grid">)(.*?)(</div>)',art,re.S)
              if gm:
                  art=art[:gm.start()]+gm.group(1)+gm.group(2)+card+gm.group(3)+art[gm.end():]
              else:
                  section='<section class="press" aria-label="Válogatott sajtómegjelenések"><div class="press-head"><span class="eyebrow">Sajtómegjelenések</span><h3>Válogatott cikkek és interjúk</h3></div><div class="press-grid">'+card+'</div></section>'
                  art=art[:-10]+section+'</article>'
              s=s[:m.start()]+art+s[m.end():]
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Press Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add recent Bajka press coverage"
          git push
