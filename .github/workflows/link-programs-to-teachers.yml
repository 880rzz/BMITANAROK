name: Link programs to Telenko Rita Bernadette

on:
  push:
    paths:
      - '.github/workflows/link-programs-to-teachers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link requested programs on teacher cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def replace_programs(section_id, links):
              nonlocal_holder = None
              start=s.find(f'id="{section_id}"')
              if start < 0:
                  raise SystemExit(f'missing section {section_id}')
              nxt=s.find('<article ', start+20)
              end=len(s) if nxt<0 else nxt
              block=s[start:end]
              label='Kapcsolódó foglalkozások'
              html='<div class="program-links"><strong>'+label+'</strong><div class="program-link-list">'+''.join(
                  f'<a href="{url}" target="_blank" rel="noopener">{name}</a>' for name,url in links
              )+'</div></div>'
              # replace any existing program-links block; otherwise append before article close boundary
              if 'class="program-links"' in block:
                  block=re.sub(r'<div class="program-links">.*?</div>\s*</div>', html, block, count=1, flags=re.S)
              else:
                  pos=block.rfind('</article>')
                  if pos<0: raise SystemExit(f'article close missing {section_id}')
                  block=block[:pos]+html+block[pos:]
              return s[:start]+block+s[end:]

          # Work sequentially against current string
          def patch(section_id, links):
              global s
              start=s.find(f'id="{section_id}"')
              if start < 0: raise SystemExit(f'missing section {section_id}')
              nxt=s.find('<article ', start+20)
              end=len(s) if nxt<0 else nxt
              block=s[start:end]
              html='<div class="program-links"><strong>Kapcsolódó foglalkozások</strong><div class="program-link-list">'+''.join(f'<a href="{url}" target="_blank" rel="noopener">{name}</a>' for name,url in links)+'</div></div>'
              if 'class="program-links"' in block:
                  block=re.sub(r'<div class="program-links">.*?</div>\s*</div>', html, block, count=1, flags=re.S)
              else:
                  pos=block.rfind('</article>')
                  if pos<0: raise SystemExit(f'article close missing {section_id}')
                  block=block[:pos]+html+block[pos:]
              s=s[:start]+block+s[end:]

          patch('telenko-eva', [('Bécsi Magyar Óvoda | Baden','https://www.magyariskola.at/event-details/ovoda-baden-2026')])
          patch('makfalvi-rita', [
              ('Bécsi Magyar Óvoda | Baden','https://www.magyariskola.at/event-details/ovoda-baden-2026'),
              ('Magyar Iskola Badenben – „Ahol a magyar szó élménnyé válik”','https://www.magyariskola.at/event-details/iskolabaden-2026')
          ])
          patch('varga-bernadette', [('Napraforgócskák','https://www.magyariskola.at/event-details/napraforgocskak-2026')])
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Link Baden kindergarten and Napraforgocskak to teacher profiles"
          git push
