name: Bind Adam and Gabriella portraits

on:
  push:
    paths:
      - '.github/workflows/bind-adam-gabriella-photos.yml'

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind portraits
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'pecze-adam': '<figure class="portrait"><img src="assets/adam.webp" alt="Pecze Ádám portréja" loading="lazy" decoding="async"><span class="fallback">Portré helye</span></figure>',
            'boronkai-gabriella': '<figure class="portrait"><img src="assets/gabriella.webp" alt="Boronkai Gabriella portréja" loading="lazy" decoding="async"><span class="fallback">Portré helye</span></figure>',
          }
          for aid, figure in replacements.items():
              pattern=rf'(<article class="profile" id="{aid}"><div class="profile-head">)<figure class="portrait">.*?</figure>'
              s,n=re.subn(pattern,lambda m:m.group(1)+figure,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{aid} portrait matches: {n}')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bind Pecze Adam and Boronkai Gabriella portraits"
          git push
