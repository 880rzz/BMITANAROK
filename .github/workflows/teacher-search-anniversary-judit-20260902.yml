name: Teacher directory finalization 20260902
on:
  push:
    paths:
      - '.github/workflows/teacher-search-anniversary-judit-20260902.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize teacher directory
        shell: python
        run: |
          from pathlib import Path
          import re
          from urllib.parse import quote

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Austrian locale and human-readable home label.
          s=s.replace('og:locale" content="hu_HU"','og:locale" content="hu_AT"')
          s=s.replace('>magyariskola.at</a>', '>Kezdőlap</a>')

          # Keep exactly one history CTA beside the program finder.
          finder='<a class="btn ghost" href="https://programvalaszto.magyariskola.at">Foglalkozást keresek</a>'
          history='<a class="btn ghost" href="https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola" target="_blank" rel="noopener external">Iskolánk története</a>'
          history_re=r'<a[^>]+href="https://hu\.wikipedia\.org/wiki/Bécsi_Magyar_Iskola"[^>]*>Iskolánk története</a>'
          s=re.sub(history_re,'',s)
          if finder in s:
              s=s.replace(finder,finder+history,1)

          # Judit's confirmed correction.
          old='A zenei és terápiás területek végül a zeneterápiában értek össze számomra; ezt 2025 óta a Bécsi Zeneművészeti Egyetemen tanultam.'
          new='A zenei és terápiás területek végül a zeneterápiában értek össze számomra; 2017 óta tanultam zeneterápiát a Bécsi Zeneművészeti Egyetemen, ahol 2025-ben szereztem meg a diplomámat.'
          s=s.replace(old,new)

          # School entity: precise Austrian address, Wikipedia identity, map, 1987/2027 facts.
          s=s.replace('"streetAddress":"Schwedenplatz 2","postalCode":"1010","addressLocality":"Wien","addressCountry":"AT"',
                      '"streetAddress":"Schwedenplatz 2 / Laurenzerberg 5, 1. em., Top 8–9","postalCode":"1010","addressLocality":"Wien","addressCountry":"AT"')
          school_marker='"url":"https://www.magyariskola.at/","email":"office@magyariskola.at"'
          school_enriched='"url":"https://www.magyariskola.at/","sameAs":["https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola"],"hasMap":"https://www.google.com/maps/search/?api=1&query=Schwedenplatz%202%20Laurenzerberg%205%201010%20Wien%20Austria","email":"office@magyariskola.at"'
          if school_marker in s and '"sameAs":["https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola"]' not in s:
              s=s.replace(school_marker,school_enriched,1)

          # Make the central address itself clickable in the footer.
          old_footer='A-1010 Wien, Schwedenplatz 2.<br>Bejárat: Laurenzerberg 5 / 1. em., 8–9. ajtó'
          full='Schwedenplatz 2 / Laurenzerberg 5, 1. em., Top 8–9, 1010 Wien, Austria'
          map_url='https://www.google.com/maps/search/?api=1&query='+quote(full)
          new_footer=f'<a class="bmi-map-address" href="{map_url}" target="_blank" rel="noopener external" aria-label="Cím megnyitása a Google Mapsben">A-1010 Wien, Schwedenplatz 2.<br>Bejárat: Laurenzerberg 5 / 1. em., 8–9. ajtó ↗</a>'
          if old_footer in s:
              s=s.replace(old_footer,new_footer,1)

          # Cache-bust final search JS/CSS so the de-duplication and Maps links load immediately.
          s=s.replace('teacher-search.css?v=20260902-1','teacher-search.css?v=20260902-2')
          s=s.replace('teacher-search.js?v=20260902-1','teacher-search.js?v=20260902-2')

          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Ecosystem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize teacher search, Maps links and Austrian entity data"
          git push
