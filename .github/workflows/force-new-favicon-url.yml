name: Force new favicon URL

on:
  push:
    paths:
      - '.github/workflows/force-new-favicon-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace favicon URL everywhere
        shell: python
        run: |
          from pathlib import Path
          import re
          exact = '<link rel="icon" href="bmi-favicon-programvalaszto-20260901.svg" type="image/svg+xml">'
          for name in ['index.html','impresszum.html','adatvedelem.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<link rel="icon"[^>]*>', exact, s, count=1)
              s=re.sub(r'\s*<link rel="shortcut icon"[^>]*>', '', s)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html impresszum.html adatvedelem.html
          git diff --cached --quiet && exit 0
          git commit -m "Force fresh favicon URL"
          git push
