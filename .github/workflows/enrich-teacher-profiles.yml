name: Enrich teacher profiles

on:
  push:
    paths:
      - '.github/workflows/enrich-teacher-profiles.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enrich researched profiles
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
          'bajka-kinga-csengele': '''<article class="profile" id="bajka-kinga-csengele"><div class="profile-head"><figure class="portrait"><img src="assets/bajka-kinga-csengele.jpg" alt="Bajka Kinga Csengele portréja" loading="lazy" decoding="async"><span class="fallback">Portré helye</span></figure><div class="profile-title"><div class="eyebrow">Pedagógus · foglalkozásvezető</div><h2>Bajka Kinga Csengele</h2><p class="role">Waldorf-pedagógiai háttérrel dolgozó alkotó és drámafoglalkozás-vezető, a SVUNG – Bécsi Magyar Színkör alapító tagja, a BMI táborainak és kreatív programjainak rendszeres szervezője.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/ovoda-2026" target="_blank" rel="noopener">Bécsi Magyar Óvoda</a><a href="https://www.magyariskola.at/event-details/varazsceruza-2026" target="_blank" rel="noopener">Varázsceruza</a><a href="https://www.magyariskola.at/event-details/kicsisvung-2026" target="_blank" rel="noopener">Kicsi Svung</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Sepsiszentgyörgyön Waldorf-iskolába járt, majd Budapestre költözve a solymári Waldorf-tanárképzés négyéves nappali tagozatán szerzett diplomát. 2016 óta Bécsben él, a SVUNG – Bécsi Magyar Színkör alapító tagja. A Bécsi Magyar Iskolában óvodai, dráma-, kreatív és tábori programokat vezet, 2024-ben pedig egy gyerekeknek szóló suliújság-műhelyben a sajtóműfajokkal és a közös szerkesztőségi munkával is megismertette a résztvevőket.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A Waldorf-pedagógia, a színpadi önkifejezés, a kézműves és vizuális alkotás, a történetmesélés, valamint azok a közösségi projektek, amelyekben a gyerekek ötletei valóban alakítják a programot.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>Foglalkozásaiban fontos a kíváncsiság, az önálló ötlet és a közös alkotás. A nyári táborok témáit is a gyerekek érdeklődéséhez igazítja; a célja nem egy előre gyártott „jó megoldás”, hanem olyan helyzetek teremtése, ahol a gyerekek kérdezhetnek, próbálkozhatnak és együtt hozhatnak létre valamit.</p></section></div></article>''',

          'schneider-erzsebet': '''<article class="profile" id="schneider-erzsebet"><div class="profile-head"><figure class="portrait"><img src="assets/schneider-erzsebet.jpg" alt="Schneider Erzsébet portréja" loading="lazy" decoding="async"><span class="fallback">Portré helye</span></figure><div class="profile-title"><div class="eyebrow">Tanító · gyógypedagógus · magyartanár</div><h2>Schneider Erzsébet</h2><p class="role">Több mint huszonöt éve dolgozik óvónőként, tanítóként és fejlesztőpedagógusként, a Bécsi Magyar Iskolában pedig 2012 óta tanít magyar származási nyelvű gyerekeket.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/magyaroktatas-kedd-2026" target="_blank" rel="noopener">Magyar nyelv · Aspern</a><a href="https://www.magyariskola.at/event-details/magyarnyelv-szerda-2026" target="_blank" rel="noopener">Magyar nyelv · Seestadt</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Pécsett óvónőképzőt, Szekszárdon tanítóképzőt végzett, majd Ausztriában honosíttatta képesítéseit és fejlesztőpedagógusi továbbképzést szerzett. 2000 óta integrációban dolgozik, főként 6–10 éves, tanulási nehézséggel, autizmussal, figyelem- vagy hiperaktivitási problémával élő gyerekeket támogatva. A Bécsi Magyar Iskolában 2012-ben kezdett tanítani, 2018 óta a 22. kerületben is önálló magyar csoportokat vezet.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Az egyéni fejlesztés, az inklúzió, a kétnyelvűség, az olvasás és írás megerősítése, a magyar irodalom és helyesírás, valamint a mozgásos, énekes, mesés és dramatikus nyelvtanulás.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A tananyagot személyre szabja, hogy minden gyermek a saját szintjéről tudjon továbblépni és sikerélményt kapjon. Fontos számára, hogy a magyar nyelv ne csak tantárgy legyen: kirándulásokkal, játékokkal, közös olvasással és hétköznapi beszélgetésekkel természetes használati közeget teremt. A szülőket is partnernek tekinti, mert a nyelv megtartását közös munkának látja.</p></section></div></article>''',

          'kiss-agnes': '''<article class="profile" id="kiss-agnes"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Tanító · iskolaigazgató · magyartanár</div><h2>Kiss Ágnes</h2><p class="role">Több mint harminc éve pedagógus, 2025 óta egy magyarországi általános iskola igazgatója, és több mint egy évtizede jár Bécsbe magyar nyelvet tanítani.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/magyarnyelv-schwedenplatz-1" target="_blank" rel="noopener">Magyar nyelv · 6–10 év</a><a href="https://www.magyariskola.at/event-details/magyarnyelv-schwedenplatz-2" target="_blank" rel="noopener">Magyar nyelv · 10–14 év</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>1992-ben végzett a győri tanítóképző főiskolán, majd a bezenyei általános iskolában kezdett dolgozni, ahol azóta is tanít. Több mint három évtized alatt több generációt kísért végig, 2025-ben az iskola igazgatói feladataival is megbízták. A Bécsi Magyar Iskolába több mint tíz éve jár rendszeresen magyar nyelvet tanítani.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar nyelv szóbeli és írásbeli fejlesztése, az olvasás és a szókincs bővítése, az irodalmi szövegek, valamint a különböző nyelvi szintű gyerekek differenciált támogatása.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A csoportban nem ugyanazt várja mindenkitől: figyelembe veszi az életkort, az írás-olvasás szintjét és azt is, mennyi magyar nyelv veszi körül a gyermeket a hétköznapokban. A kisebbeknél játékos, kreatív feladatokkal dolgozik, a nagyobbaknál irodalmi szövegekkel, nyelvi kifejezőeszközökkel és digitális felületekkel is. A magyar nyelvre olyan otthonként tekint, amelyet a diaszpórában különösen érdemes életben tartani.</p></section></div></article>''',

          'boronkai-gabriella': '''<article class="profile" id="boronkai-gabriella"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Pedagógus · vizuális nevelés · sport- és aerobic oktató</div><h2>Boronkai Gabriella</h2><p class="role">A vizuális alkotást, a mozgást és a játékos készségfejlesztést természetesen kapcsolja össze a gyerekekkel végzett munkában.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/rajztabla-2026" target="_blank" rel="noopener">RAJZTÁBLA</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Pedagógus, emellett okleveles sport- és aerobic oktató. A Bécsi Magyar Iskolában évek óta vezet gyermekfoglalkozásokat és nyári táborokat; a Mesés Világ Tábor egyik visszatérő vezetője, korábban pedig zenés, mozgásos Ovistornát is tartott.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A rajz és vizuális nevelés, a mozgás, a koordináció, a koncentráció és az iskola-előkészítő készségek. A Rajztáblában a kompozíció, arányok, fény–árnyék, perspektíva és eszközhasználat alapjait teszi hozzáférhetővé a 10 év feletti korosztálynak.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A fejlesztést játékba, mesébe és alkotásba ágyazza. Fontosnak tartja, hogy a gyermek konkrét eszközöket kapjon ahhoz, amit meg szeretne jeleníteni, miközben a mozgásos és kreatív feladatok egyszerre támogatják a figyelmet, az együttműködést és az önkifejezést.</p></section></div></article>''',

          'korchma-zsombor': '''<article class="profile" id="korchma-zsombor"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Újságíró · Minecraft-foglalkozásvezető</div><h2>Korchma Zsombor</h2><p class="role">A Minecraft világát történelemmel, építészettel, tervezéssel és csapatmunkával kapcsolja össze.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/becscraft-2026" target="_blank" rel="noopener">BÉCS-CRAFT Workshop</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Eredetileg újságíró, és korábban egy magyarországi magániskolában is dolgozott. A Minecraft-alapú táborok ötlete saját gyerekei játékélményéből indult: azt kereste, hogyan lehet a képernyőn töltött időt építő, közös és tanulással összekapcsolt tevékenységgé alakítani. A módszerből többéves tábori és foglalkozásvezetői gyakorlat lett.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Építészet, várostörténet, térbeli gondolkodás, mérés és tervezés, digitális építés, valamint a nagy léptékű közös projektek. A gyerekekkel valós épületeket vizsgálnak meg, felmérik és vázlatolják őket, majd együtt építik újra a Minecraftban.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A játékot nem jutalomként, hanem tanulási környezetként használja. A gyerekek egy konkrét közös célon dolgoznak, ezért természetesen jelenik meg a kutatás, a pontosság, a feladatmegosztás és az egymás munkájára építés. A hangsúly azon van, hogy a digitális világ ne elszigeteljen, hanem együttműködésre és kíváncsiságra adjon okot.</p></section></div></article>''',

          'hierholcz-anna': '''<article class="profile" id="hierholcz-anna"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Musical foglalkozásvezető · közösségi szervező</div><h2>Hierholcz Anna</h2><p class="role">A gyerekekkel közösen épített történeteket, személyre szabott szerepeket és a zene–színház játékosságát helyezi a musicalfoglalkozások középpontjába.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/mammut-2026" target="_blank" rel="noopener">MaMUT Musical Stúdió</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Bécsi Magyar Iskola musicalcsoportjának vezetője. 2026-ban a csoport első saját előadásának, A Nagy Olümposzi Eposznak a történetét és cselekményét a szerzőtársakkal közösen dolgozta ki; a karakterek és a prózai váz kialakításában is részt vett.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A musical, a dramaturgia, a közös történetalkotás, a szerepformálás és az a fajta színházi munka, ahol a próza, a zene, a humor és a gyerekek saját személyisége találkozik.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A szerepeket nem kész sablonként osztja ki: a gyerekek személyiségét és erősségeit is figyelembe veszi. A közös alkotási folyamatban fontos a beszélgetés, a karakterek megértése és az, hogy a résztvevők ne csak megtanuljanak egy előadást, hanem értsék is, mit és miért játszanak.</p></section></div></article>''',

          'trencsenyi-klara': '''<article class="profile" id="trencsenyi-klara"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">DLA · operatőr · dokumentumfilm-rendező</div><h2>Dr. Trencsényi Klára DLA</h2><p class="role">A dokumentumfilm eszközein keresztül tanít meg figyelni, kérdezni, együtt dolgozni és történetet mesélni.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/filmesmuhely-2026" target="_blank" rel="noopener">Filmes Műhely</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Operatőr és dokumentumfilm-rendező, filmes workshopokat is vezet fiataloknak. Bécsi foglalkozásain a résztvevők kamerával, állvánnyal és a filmes szerepkörökkel – például rendező, operatőr, asszisztens és naplózó – ismerkedtek meg, majd saját rövid történeteket építettek.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Dokumentumfilm, vizuális történetmesélés, interjúkészítés, storyboard, családi emlékezet és a személyes tárgyakon keresztül elmesélhető történetek. Kutatási projektekben a migráció, a városi beilleszkedés és a családi tapasztalatok filmes megközelítésével is foglalkozik.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A filmezést csapatmunkaként tanítja. Bemelegítő és koncentrációs gyakorlatokkal indít, majd a technikai tudást rögtön kreatív feladatokhoz kapcsolja. A cél nem pusztán egy videó elkészítése, hanem annak megtapasztalása, hogyan lehet megfigyelésből, kérdésből, emlékből és közös munkából történet.</p></section></div></article>''',

          'falusi-dora': '''<article class="profile" id="falusi-dora"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Vallástudományi kutató · szerkesztő · foglalkozásvezető</div><h2>Falusi Dóra</h2><p class="role">A történelmet, vallást, irodalmat, képzőművészetet és hétköznapi kultúrát egyetlen nagy, gyerekekkel közösen felfedezhető történetté kapcsolja össze.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/fecskeklub-2026" target="_blank" rel="noopener">Fecske Klub</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Vallástudományi kutató és szerkesztő, a Károli Gáspár Református Egyetem vallástudomány mesterszakán végzett. Franciaországi és spanyolországi évek után 2021-ben Bécsben telepedett le. A Fecske Klub alapítójaként gyermekeknek szóló kultúr- és tudománytörténeti programokat dolgoz ki és vezet.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Magyar és európai kultúrtörténet, vallástörténet, irodalom, képzőművészet, építészet, néprajz, mitológia és azok a pontok, ahol a különböző korszakok és tudományterületek összekapcsolódnak.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>Nála nincs házi feladat, vizsga vagy tudásszintfelmérő. Sok képpel, rövid videóval, kérdéssel és irányított beszélgetéssel dolgozik, majd a gyerekek kreatív feladatban dolgozzák fel a témát. Arra bátorítja őket, hogy kérdezzenek és saját véleményt fogalmazzanak meg; a cél nem adatok bemagolása, hanem összefüggések felismerése és a kultúrához való személyes kapcsolat kialakítása.</p></section></div></article>''',

          'egri-monika': '''<article class="profile" id="egri-monika"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Meseíró · illusztrátor · foglalkozásvezető</div><h2>Egri Mónika</h2><p class="role">Több évtizedes animációs és illusztrációs tapasztalatát olyan alkotóműhelyekbe viszi át, ahol a résztvevők saját képi megoldásaikat kereshetik.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/rekreacio-2026" target="_blank" rel="noopener">ReKreáció – Kreatív Közösségi Kuckó</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Pályáját animációs rajzfilmrajzolóként kezdte, és mintegy tizennégy éven át dolgozott animációs produkciókban, többek között a Pumukli kalandjai, a Pettson és Findusz és a Mr Bean animációs sorozat projektjeiben. Dolgozott nemzetközi filmes produkciókban kellékesként, gyermekmagazin szerkesztőségében, 2010 óta pedig szabadúszó illusztrátor. Több mint harmincöt kiadványban jelentek meg munkái; a legismertebbek közé tartozik a Babaróka-sorozat. 2018-ban saját mesekönyve is megjelent Állati illemtan címmel.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Gyerekkönyv-illusztráció, animáció, humoros vizuális történetmesélés, akvarell, pop-up technika, meseírás és a közös alkotás. Munkáiban a rajz és a történet szorosan összetartozik.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A workshopjain kifejezetten arra biztatja a résztvevőket, hogy ne az ő mintáját másolják, hanem saját megoldást keressenek. Nem vár magas szintű rajztudást: technikát mutat, segít, de az egyedi alkotást tekinti fontosnak. A ReKreációban ehhez közösségi és környezettudatos szemlélet is társul.</p></section></div></article>'''
          }

          for teacher_id, replacement in replacements.items():
              pattern = rf'<article class="profile" id="{re.escape(teacher_id)}">.*?</article>'
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Profile not found or duplicated: {teacher_id} ({n})')
              s = s2

          s = s.replace('href="https://programvalaszto.magyariskola.at/bmi_blue_round_rgb_logo.svg" type="image/svg+xml"', 'href="bmi_blue_round_rgb_logo.svg" type="image/svg+xml"')
          p.write_text(s, encoding='utf-8')
      - name: Commit enrichment
        run: |
          git config user.name "BMI Teacher Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enrich teacher profiles from verified public sources"
          git push
