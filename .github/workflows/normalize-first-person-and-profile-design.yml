name: Normalize first-person copy and profile design
on:
  push:
    paths:
      - '.github/workflows/normalize-first-person-and-profile-design.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize profile design and first-person voice
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          # Canonical design repair for the two newest profiles. Reuse the same profile-head,
          # portrait, profile-title, programs and bio-segments structure as every other profile.
          def replace_article(pid, article):
              global s
              pat=r'<article class="profile" id="'+re.escape(pid)+r'">.*?(?=<article class="profile" id=|</section>\s*</main>)'
              if not re.search(pat,s,re.S):
                  raise SystemExit('profile not found: '+pid)
              s=re.sub(pat,article+'\n',s,count=1,flags=re.S)

          pohl='''<article class="profile" id="pohl-balazs"><div class="profile-head"><figure class="portrait"><img src="assets/pohl_balazs.webp" alt="Pohl Balázs portréja" loading="lazy" decoding="async"><span class="fallback">Pohl Balázs portréja</span></figure><div class="profile-title"><div class="eyebrow">Drámapedagógus · író-rendező · SVUNG művészeti vezető</div><h2>Pohl Balázs</h2><p class="role">Számomra a színház és a pedagógia nem két külön pálya. A színészi tapasztalatot, a Waldorf-pedagógiát és a több évtizedes színpadi munkát úgy kapcsolom össze, hogy a fiatalok ne kész válaszokat kapjanak, hanem megtanuljanak jelen lenni, reagálni, kérdezni és együtt gondolkodni.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/gimisvung-2026" target="_blank" rel="noopener">Gimi Svung – Magyar nyelvű drámafoglalkozás</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Fiatalon színiiskolába jártam, Budapesten a Kolibri Színházban és a Pinceszínházban is dolgoztam, emellett film-, rádiójáték- és szinkronmunkákban vettem részt. Később a Waldorf-pedagógia felé fordultam: elvégeztem a Waldorf-tanárképzést, tanítottam, diákszínjátszó csoportokat vezettem, majd oktatóként is visszatértem a tanárképzésbe. 2015-ben Bécsbe költöztem, és létrehoztam a későbbi SVUNG – Bécsi Magyar Színházat. A társulatban művészeti vezetőként, szerzőként és rendezőként dolgozom; a színházi alkotás gyerekkorom óta végigkíséri az életemet.</p></section><section class="segment"><h3>A hozzám különösen közel álló területek</h3><p>A drámapedagógia, a darab- és jelenetírás, a rendezés, az improvizáció és a közösségi színház áll hozzám a legközelebb. A SVUNG-ban felnőtt- és gyerekelőadásokon, saját szövegeken és átdolgozásokon egyaránt dolgozom. A Gimi Svungban ehhez kapcsolom a magyar nyelvi kifejezést, a szövegértést, az önismeretet, az empátiát és a színpadi jelenlét fejlesztését.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A drámára önismereti folyamatként és olyan eszközként tekintek, amely közelebb tudja vinni a tananyagot és a kérdéseket a résztvevőkhöz. Nem egyszerűen előadást szeretnék készíteni egy csoporttal: arra ösztönzöm a fiatalokat, hogy a saját tapasztalataikból, ötleteikből és véleményükből építsünk közös színpadi anyagot, és közben merjenek felelősséget vállalni a közös munkáért.</p></section></div><section class="press" aria-label="Pohl Balázs válogatott sajtómegjelenései"><div class="press-head"><span class="eyebrow">Sajtómegjelenések</span><h3>Válogatott interjúk és cikkek</h3></div><div class="press-grid"><a class="press-card" href="https://rolunk.at/nepcsoportunk/svung-becsi-magyar-szinkor/" target="_blank" rel="noopener"><span class="press-medium">Rólunk.at</span><strong>SVUNG – Bécsi Magyar Színkör</strong><span class="press-desc">Portré a társulatról, az alkotói útról és a bécsi magyar színházi közösségről.</span><span class="press-open">Cikk megnyitása ↗</span></a></div></section></article>'''

          poser='''<article class="profile" id="poser-piroska-ildiko"><div class="profile-head"><figure class="portrait"><img src="assets/piroska.webp" alt="Póser-Piroska Ildikó portréja" loading="lazy" decoding="async"><span class="fallback">Póser-Piroska Ildikó portréja</span></figure><div class="profile-title"><div class="eyebrow">Csapatparancsnok · ifjúsági közösségi vezető · cserkészet</div><h2>Póser-Piroska Ildikó</h2><p class="role">A cserkészet számomra nem egy kívülről felvett vezetői szerep, hanem közösség, felelősség és életforma. Gyerekkorom óta része az életemnek, ma pedig csapatparancsnokként azon dolgozom, hogy a bécsi magyar fiatalok olyan közösséghez tartozzanak, ahol a magyar nyelv, az identitás, az önállóság és a másokért vállalt felelősség egyszerre tud erősödni.</p><div class="programs"><a href="https://programvalaszto.magyariskola.at/foglalkozasok.html#cserkeszet" target="_blank" rel="noopener">Cserkészet | Alliiertenstrasse</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai és közösségi háttér</h3><p>Gyerekkorom óta cserkész vagyok, és hosszú évek óta dolgozom a bécsi magyar cserkészközösségben. 2016 óta a 72. sz. Széchenyi István Cserkészcsapat csapatparancsnokaként felelek a közösség működéséért és a vezetői munka összehangolásáért. Számomra a cserkészet egyik legnagyobb értéke, hogy a fiatalok nem nézőként vannak jelen, hanem fokozatosan valódi feladatokat és felelősséget kapnak.</p></section><section class="segment"><h3>A hozzám különösen közel álló területek</h3><p>A közösségépítés, a jellemnevelés, a magyar nyelv és kultúra továbbadása, az ifjúsági vezetőképzés és a generációk közötti kapcsolat áll hozzám a legközelebb. Fontosnak tartom azt is, hogy a fiatalok megtapasztalják: egy közösség nem valami készen kapott dolog, hanem olyan tér, amelyért nekik is tenniük kell.</p></section><section class="segment"><h3>Vezetői szemlélet</h3><p>Abban hiszek, hogy életrevaló, önálló és segítőkész fiatalokat nem pusztán elmondott szabályokkal lehet nevelni. Valódi helyzetekre, bizalomra, feladatokra és egymásra utaltságra van szükség. Vezetőként igyekszem olyan keretet teremteni, ahol lehet hibázni, tanulni, kezdeményezni és fokozatosan felelősséget vállalni másokért is.</p></section></div><section class="press" aria-label="Póser-Piroska Ildikó válogatott sajtómegjelenései"><div class="press-head"><span class="eyebrow">Sajtómegjelenések</span><h3>Válogatott interjúk és cikkek</h3></div><div class="press-grid"><a class="press-card" href="https://volksgruppen.orf.at/magyarok/stories/3284115/" target="_blank" rel="noopener"><span class="press-medium">ORF Magyarok</span><strong>Egyszer cserkész, mindig cserkész</strong><span class="press-desc">Beszélgetés a cserkészetről, jellemnevelésről és közösségépítésről.</span><span class="press-open">Cikk megnyitása ↗</span></a><a class="press-card" href="https://rolunk.at/" target="_blank" rel="noopener"><span class="press-medium">Rólunk.at</span><strong>Bécsi magyar cserkészközösség</strong><span class="press-desc">A közösségi és vezetői szerephez kapcsolódó szerkesztőségi háttéranyagok.</span><span class="press-open">Forrás megnyitása ↗</span></a></div></section></article>'''

          replace_article('pohl-balazs',pohl)
          replace_article('poser-piroska-ildiko',poser)

          # Human first-person rewrites for the established profile copy. These replacements are
          # deliberately phrase-level, not blind suffix substitution, so Hungarian stays natural.
          R={
          'bajka-kinga-csengele':(
            'Waldorf-pedagógiai háttérrel dolgozom alkotóként és drámafoglalkozás-vezetőként; a SVUNG – Bécsi Magyar Színkör alapító tagja vagyok, és rendszeresen szervezek kreatív programokat, táborokat.',
            ['Sepsiszentgyörgyön Waldorf-iskolába jártam, majd Budapestre költözve a solymári Waldorf-tanárképzés négyéves nappali tagozatán szereztem diplomát. 2016 óta Bécsben élek, a SVUNG – Bécsi Magyar Színkör alapító tagjaként. A Bécsi Magyar Iskolában óvodai, dráma-, kreatív és tábori programokat vezetek; 2024-ben egy gyerekeknek szóló suliújság-műhelyben a sajtóműfajokkal és a közös szerkesztőségi munkával is megismertettem a résztvevőket.','A Waldorf-pedagógia, a színpadi önkifejezés, a kézműves és vizuális alkotás, a történetmesélés és azok a közösségi projektek állnak hozzám közel, amelyekben a gyerekek ötletei valóban alakítják a programot.','Fontos nekem a kíváncsiság, az önálló ötlet és a közös alkotás. A témákat is igyekszem a gyerekek érdeklődéséhez igazítani: nem egy előre gyártott „jó megoldást” szeretnék átadni, hanem olyan helyzeteket teremteni, ahol kérdezhetnek, próbálkozhatnak és együtt hozhatunk létre valamit.']),
          'horanyi-bori':('Integratív gyerekterápiás konzulensként dolgozom; alapozó-, homloklebeny- és dinamikus szenzoros integrációs terápiás tapasztalataimat mindig az adott gyermekhez és családhoz igazítom.',['Egyetemi hallgatóként sérült babák bölcsődei integrációjával kezdtem dolgozni a Budapesti Korai Fejlesztő Központ fiatal csapatával. Már az egyetemi éveim alatt bekapcsolódtam az első magyarországi Ayres-terápia képzésbe. 2001 óta alapozó terapeutaként dolgozom; a Komplex Integratív Gyermekpszichoterápia képzést 2011 és 2015 között végeztem el.','A mozgás, a viselkedés, a tanulási képességek és a személyiségfejlődés összefüggései állnak hozzám a legközelebb. Fontos területem a szenzoros integráció, az alapozó és homloklebeny-terápia, valamint a figyelem, a tervezés, a szervezés és az érzelemszabályozás támogatása neuroaffirmatív szemléletben.','Abból indulok ki, hogy fejlődni biztonságos érzelmi térben és valódi kapcsolatban lehet. A neurológiai különbségeket az emberi sokféleség természetes részének tekintem, és mindig azt keresem, hogyan támogathatom a gyermeket, a felnőttet vagy a szülőt úgy, hogy közben megőrizhesse az önazonosságát.']),
          'schneider-erzsebet':('Több mint harminc éve dolgozom pedagógusként a 6–10 éves korosztállyal. Az integratív pedagógiát, a Montessori-szemléletet, a motopedagógiát és a magyar nyelv élményszerű átadását kapcsolom össze; 2012 óta tanítok a Bécsi Magyar Iskolában.',['2012 óta vagyok a Bécsi Magyar Iskola magyartanára. 2000 óta az osztrák iskolarendszerben dolgozom általános iskolai tanítóként és gyógypedagógusként, több éven át integrációs osztályokban. Korábban Ausztriában óvodapedagógusként, Magyarországon pedig öt éven át alsó tagozatos tanítóként és osztályfőnökként dolgoztam. Magyarországon tanítói és óvodapedagógusi oklevelet szereztem; Ausztriában gyógypedagógiai tanári képesítést, Montessori-pedagógiai diplomát és motopedagógiai tanúsítványt.','Az integratív és inkluzív pedagógia, a Montessori-pedagógia, a motopedagógia, az interkulturális tanulás és a magyar nyelv és kultúra átadása áll hozzám különösen közel. Kiemelten fontosnak tartom a különböző fejlődési utak felismerését és az egyéni erősségekre építő fejlesztést.','Mindig a gyermek egyéni fejlődéséből indulok ki. Arra törekszem, hogy a tanulás biztonságos, örömteli és motiváló folyamat legyen, amelyben a gyerekek a saját erősségeikre támaszkodhatnak. A magyar nyelv oktatásában a játékosságot, a kulturális kötődést, a mozgást és a differenciált feladatadást kapcsolom össze.']),
          'makfalvi-rita':('Óvodapedagógusként, tanítóként, nyelv- és beszédfejlesztő pedagógusként és meseterápiás foglalkozásvezetőként több évtizede dolgozom gyerekekkel.',['Óvodapedagógusként, tanítóként, nyelv- és beszédfejlesztő pedagógusként, valamint alkotó-fejlesztő meseterápiás foglalkozásvezetőként több évtizede dolgozom gyermekekkel.','Az anyanyelvi nevelés, a beszéd- és szókincsfejlesztés, az olvasás megszerettetése, a Meixner-módszer, a Mesezene élménypedagógia és az alkotó-fejlesztő meseterápia áll hozzám különösen közel.','Biztonságos, elfogadó és inspiráló közeget szeretnék teremteni, ahol minden gyermek a saját tempójában haladhat, és a magyar nyelvhez pozitív élmények kapcsolódhatnak.']),
          'fersztl-barnabas':('A mérnöki rendszerszemléletet a sakk gyakorlati logikájával kapcsolom össze. A foglalkozásaimon a figyelem, a tervezés és a következmények előrelátása kerül középpontba.',['A Széchenyi István Egyetemen járműmérnöki tanulmányokat végeztem, majd mechanikai tervezőmérnökként dolgoztam járműipari kutatás-fejlesztésben. Az SZEnergy Team tagjaként részt vettem a Shell Eco-marathon Urban Concept akkumulátoros-elektromos kategóriájának 2022-es győztes projektjében. Bécsben a Bécsi Magyar Iskola sakk- és gondolkodásfejlesztő foglalkozását vezetem.','A sakk, a stratégiai gondolkodás, a rendszerszemlélet, a problémamegoldás, a koncentráció és az előrelátás áll hozzám közel.','A sakkra nem pusztán szabályok megtanulásaként tekintek. Feladványokkal, megnyitási helyzetekkel és valódi játszmákkal dolgozom, hogy a résztvevők több lépéssel előre tudjanak gondolkodni, döntéseket hasonlítsanak össze és a saját hibáikból is tanuljanak. A kis létszámú csoportot azért tartom fontosnak, mert így jut idő az egyéni figyelemre.']),
          'noszko-niki':('Pszichológusként és gyermekpszichodráma-csoportvezetőként a játékot, a fantáziát és a biztonságos kiscsoportos teret használom arra, hogy a gyerekek könnyebben dolgozzák fel a feszültségeiket és bátrabban kapcsolódjanak egymáshoz.',['2007-ben végeztem pszichológia szakon, 2011 óta foglalkozom pszichodrámával. A gyermekpszichodráma módszerét Kende B. Hanna szakmai hagyományához kapcsolódó képzésben sajátítottam el. A Bécsi Magyar Iskolában gyermekpszichodráma-bemutatókat és kiscsoportos foglalkozásokat vezettem, emellett a Bécsi Magyar Óvoda egyik foglalkozásvezetője vagyok.','A gyermekpszichodráma, a játék és a fantázia fejlesztő ereje, a szorongás és feszültség oldása, a társas kapcsolatok, az önbizalom és az érzelmi biztonságot adó kiscsoportos munka áll hozzám közel.','Nem kész történeteket adok a gyerekeknek, hanem olyan keretet teremtek, amelyben idővel a saját történeteik és szerepeik születhetnek meg. Fontosnak tartom a zárt, kis létszámú csoportot, mert az állandó közösség biztonságot ad. A szülőkkel való együttműködést is a folyamat fontos részének tekintem.']),
          'kiss-agnes':('Több mint harminc éve vagyok pedagógus, 2025 óta egy magyarországi általános iskola igazgatója vagyok, és több mint egy évtizede járok Bécsbe magyar nyelvet tanítani.',['1992-ben végeztem a győri tanítóképző főiskolán, majd a bezenyei általános iskolában kezdtem dolgozni, ahol azóta is tanítok. Több mint három évtized alatt több generációt kísértem végig, 2025-ben pedig az iskola igazgatói feladataival is megbíztak. A Bécsi Magyar Iskolába több mint tíz éve járok rendszeresen magyar nyelvet tanítani.','A magyar nyelv szóbeli és írásbeli fejlesztése, az olvasás, a szókincs bővítése, az irodalmi szövegek és a különböző nyelvi szintű gyerekek differenciált támogatása áll hozzám közel.','Nem ugyanazt várom mindenkitől: figyelembe veszem az életkort, az írás-olvasás szintjét és azt is, mennyi magyar nyelv veszi körül a gyermeket a hétköznapokban. A kisebbeknél játékos, kreatív feladatokkal, a nagyobbaknál irodalmi szövegekkel és digitális felületekkel is dolgozom. A magyar nyelvre olyan otthonként tekintek, amelyet a diaszpórában különösen érdemes életben tartani.']),
          'boronkai-gabriella':('A vizuális alkotást, a mozgást és a játékos készségfejlesztést természetesen kapcsolom össze a gyerekekkel végzett munkámban.',['Pedagógus vagyok, emellett okleveles sport- és aerobic oktató. A Bécsi Magyar Iskolában évek óta vezetek gyermekfoglalkozásokat és nyári táborokat; a Mesés Világ Tábor egyik visszatérő vezetője vagyok, korábban pedig zenés, mozgásos Ovistornát is tartottam.','A rajz és vizuális nevelés, a mozgás, a koordináció, a koncentráció és az iskola-előkészítő készségek állnak hozzám közel. A Rajztáblában a kompozíció, az arányok, a fény–árnyék, a perspektíva és az eszközhasználat alapjait igyekszem hozzáférhetővé tenni.','A fejlesztést játékba, mesébe és alkotásba ágyazom. Fontosnak tartom, hogy a gyermek konkrét eszközöket kapjon ahhoz, amit meg szeretne jeleníteni, miközben a mozgásos és kreatív feladatok egyszerre támogatják a figyelmet, az együttműködést és az önkifejezést.']),
          'korchma-zsombor':('A Minecraft világát történelemmel, építészettel, tervezéssel és csapatmunkával kapcsolom össze.',['Eredetileg újságíró vagyok, és korábban egy magyarországi magániskolában is dolgoztam. A Minecraft-alapú táborok ötlete a saját gyerekeim játékélményéből indult: azt kerestem, hogyan lehet a képernyőn töltött időt építő, közös és tanulással összekapcsolt tevékenységgé alakítani. Ebből többéves tábori és foglalkozásvezetői gyakorlat lett.','Az építészet, a várostörténet, a térbeli gondolkodás, a mérés és tervezés, a digitális építés és a nagy léptékű közös projektek állnak hozzám közel. A gyerekekkel valós épületeket vizsgálunk meg, felmérjük és vázlatoljuk őket, majd együtt építjük újra a Minecraftban.','A játékot nem jutalomként, hanem tanulási környezetként használom. Egy konkrét közös célon dolgozunk, ezért természetesen jelenik meg a kutatás, a pontosság, a feladatmegosztás és az egymás munkájára építés. Azt szeretném, hogy a digitális világ ne elszigeteljen, hanem együttműködésre és kíváncsiságra adjon okot.']),
          'hierholcz-anna':('A musicalfoglalkozásokon a gyerekekkel közösen épített történeteket, a személyre szabott szerepeket és a zene–színház játékosságát helyezem a középpontba.',['A Bécsi Magyar Iskola musicalcsoportját vezetem. 2026-ban a csoport első saját előadásának, A Nagy Olümposzi Eposznak a történetét és cselekményét szerzőtársakkal közösen dolgoztam ki; a karakterek és a prózai váz kialakításában is részt vettem.','A musical, a dramaturgia, a közös történetalkotás, a szerepformálás és az a fajta színházi munka áll hozzám közel, ahol a próza, a zene, a humor és a gyerekek saját személyisége találkozik.','A szerepeket nem kész sablonként osztom ki: figyelembe veszem a gyerekek személyiségét és erősségeit is. Fontos nekem a beszélgetés, a karakterek megértése és az, hogy ne csak megtanuljunk egy előadást, hanem értsük is, mit és miért játszunk.']),
          'pecze-adam':('A Bécsi Magyar Musical Társulatban a zongora és a zeneszerzés területét képviselem, és zenei oldalról kapcsolódom a gyerekek közös színpadi munkájához.',['A Bécsi Magyar Musical Társulatban zongorával és zeneszerzéssel foglalkozom. A MaMUT Musical Stúdióban a zenei munka oldaláról veszek részt a közös alkotásban.','A zongora, a zeneszerzés, a musical zenei világa és az a folyamat áll hozzám közel, amelyben a dallam, a ritmus és a színpadi történet egymást erősíti.','Számomra a musicalműhelyben a zene nem különálló kíséret, hanem a közös előadás része. A zongorás és zeneszerzői munkával azt szeretném segíteni, hogy a gyerekek a ritmust, a dallamot, a szöveget és a színpadi jelenlétet egységben tapasztalják meg.']),
          'trencsenyi-klara':('A dokumentumfilm eszközein keresztül tanítok figyelni, kérdezni, együtt dolgozni és történetet mesélni.',['Operatőr és dokumentumfilm-rendező vagyok, és filmes workshopokat is vezetek fiataloknak. Bécsi foglalkozásaimon a résztvevőkkel kamerával, állvánnyal és különböző filmes szerepkörökkel dolgozunk, majd saját rövid történeteket építünk.','A dokumentumfilm, a vizuális történetmesélés, az interjúkészítés, a storyboard, a családi emlékezet és a személyes tárgyakon keresztül elmesélhető történetek állnak hozzám közel. Kutatási projektekben a migráció, a városi beilleszkedés és a családi tapasztalatok filmes megközelítésével is foglalkozom.','A filmezést csapatmunkaként tanítom. Bemelegítő és koncentrációs gyakorlatokkal indítok, majd a technikai tudást rögtön kreatív feladatokhoz kapcsolom. A célom nem pusztán egy videó elkészítése, hanem annak megtapasztalása, hogyan lesz megfigyelésből, kérdésből, emlékből és közös munkából történet.']),
          'falusi-dora':('A történelmet, vallást, irodalmat, képzőművészetet és hétköznapi kultúrát egyetlen nagy, a gyerekekkel közösen felfedezhető történetté kapcsolom össze.',['Vallástudományi kutató és szerkesztő vagyok, a Károli Gáspár Református Egyetem vallástudomány mesterszakán végeztem. Franciaországi és spanyolországi évek után 2021-ben Bécsben telepedtem le. A Fecske Klub alapítójaként gyermekeknek szóló kultúr- és tudománytörténeti programokat dolgozok ki és vezetek.','A magyar és európai kultúrtörténet, vallástörténet, irodalom, képzőművészet, építészet, néprajz és mitológia áll hozzám közel, főleg azok a pontok, ahol különböző korszakok és tudományterületek összekapcsolódnak.','Nálam nincs házi feladat, vizsga vagy tudásszintfelmérő. Sok képpel, rövid videóval, kérdéssel és beszélgetéssel dolgozom, majd kreatív feladatban dolgozzuk fel a témát. Arra bátorítom a gyerekeket, hogy kérdezzenek és saját véleményt fogalmazzanak meg; nem az adatok bemagolása a célom, hanem az összefüggések felismerése és a kultúrához való személyes kapcsolat.']),
          'hupczik-andrea':('Informatikatanár, hagyományőrző közösségi szervező és két fiúgyermek édesanyja vagyok. A magyar hagyományokat közösségi élménnyé szeretném tenni, miközben digitális és informatikai tudást is átadok.',['A Regélő Fehér Táltos Hagyományőrző Egyesület bécsi kapcsolattartója vagyok, és a Bécsi Magyar Iskolához kapcsolódó dobos-hagyományőrző programok egyik helyi szervezőjeként dolgozom. Az Együtt dobban Bécs programban a 2007 óta működő hagyományőrző dobcsapat szakmai közösségét kapcsolom össze a bécsi résztvevőkkel.','A közösségi dobolás, az ének, a magyar mondavilág és hagyományőrzés, a generációk közötti kapcsolódás, valamint az informatika és digitális készségfejlesztés áll hozzám közel.','Fontos alapelvem, hogy nem kell előzetes zenei vagy dobos tudás. A résztvevők egymásra figyelve tanulnak ritmust tartani, vezetni és alkalmazkodni. A szülőket sem csak kísérőként látom: örülök, ha a gyerekekkel együtt ők is bekapcsolódnak.']),
          'telenko-eva':('Több mint tizenöt éve foglalkozom gyermekekkel a hat hónapos kortól a kisiskolás korig. A mozgást, a játékot és a közös felfedezést olyan alapnak tekintem, amelyen keresztül a gyerekek a saját képességeiket és érzéseiket is egyre tudatosabban ismerhetik meg.',['Fejlesztőpedagógiai, mozgásfejlesztési és gyermekjóga területen tanultam, emellett Brain Gym®-oktatóként is dolgozom. Pedagógiai gondolkodásomra a Waldorf-szemlélet is hatással van. Magyarországon integrált bölcsődei és óvodai csoportban csoportvezetőként szereztem tapasztalatot, jelenleg egy badeni önkormányzati óvodában dolgozom. A Bécsi Magyar Iskolában hat éve tartok óvodás foglalkozásokat és táborokat.','A mozgás- és képességfejlesztés, a szabad és kreatív játék, a gyermekjóga, a Brain Gym® és a gyermekek érzelmi önkifejezésének támogatása áll hozzám különösen közel. Fontos nekem a Waldorf-pedagógia holisztikus szemlélete is.','A gyerekekkel való foglalkozásra mindenekelőtt kapcsolatként, játékként és közös felfedezésként tekintek. Olyan biztonságos és inspiráló közeget szeretnék teremteni, ahol a gyermek önmaga lehet, bátran próbálkozhat, örömmel mozoghat, és saját élményként élheti meg azt, hogy „meg tudom csinálni”.']),
          'varga-bernadette':('A Napraforgócskák gyerektánccsoportot Veres Tamással vezetem. Külföldön született magyarként a magyar nyelv, néptánc, népzene és közösség továbbadását személyes ügyemnek tekintem; ezt a munkát mérnöki főállásom mellett önkéntesen végzem.',['A TU Wien Bauingenieurwesen szakán végeztem, hivatalos titulussal Dipl.-Ing., és teljes állásban projektvezető statikusként dolgozom. A néptánc gyerekkorom óta része az életemnek: már óvodásként táncházakba jártam, később a cserkészetben sokat foglalkoztam gyerekekkel, és több vezetői képzést is elvégeztem. Az egyesületben intenzíven táncolok, és ennek természetes folytatásaként vezetem a Napraforgócskákat.','A gyerekekkel való foglalkozás, a néptánc, a népzene, a játékos oktatás és a közösségformálás áll hozzám a legközelebb. Fontos nekem, hogy a gyerekek magyar énekeket, népi játékokat és táncokat tanuljanak, miközben a nyelvhez és a közösséghez való kötődésük is erősödik.','Abból a személyes tapasztalatból indulok ki, hogy a hagyomány csak akkor marad élő, ha a következő generáció ténylegesen használja és megéli. A foglalkozásokon ezért a néptánc és a népzene mellett minden alkalommal helyet kap a játék is. Nem elsősorban fellépésre készítek: azt szeretném, hogy a magyar kulturális közeg természetes és örömteli élménnyé váljon.']),
          'veres-tamas':('Hatéves korom óta néptáncolok, és a táncra ma is olyan élő közösségi nyelvként tekintek, amelyet gyerekekkel ugyanúgy örömmel lehet megszerettetni, mint felnőttekkel.',['Hatévesen kezdtem néptáncolni Gyöngyösön, a Tomory Gábor Néptánciskolában, amelynek egyetemista koromig tagja voltam. Bécsbe költözésem után csatlakoztam a Napraforgókhoz, majd 2023-tól Varga Bernadette-tel közösen átvettük a Napraforgócskák gyermekcsoport vezetését. A gyerekcsoport házi zenekarában ütőgardonon is játszom.','A magyar néptánc, a közösségi táncház, a gyermek-néptáncoktatás, a ritmus és az élő népzene áll hozzám közel. A tánc számomra nem időszakos hobbi, hanem olyan állandó közeg, amelyet új városban is ösztönösen kerestem.','Gyerekekkel játékos, közvetlen légkörben dolgozom. A próbákon a tánclépések mellett népdalok, játékok, csujjogatások és közös színpadi feladatok is helyet kapnak. Fontos nekem az egymásra figyelés és az, hogy a gyerekek a hagyományt ne kötelességként, hanem saját élményként vigyék tovább.']),
          'banhalmi-norbert':('Fotósként és oktatóként azt keresem, hogyan lesz a technikából saját látásmód, egy jól elkészített képből pedig valódi történet. Gyerekekkel és felnőttekkel egyaránt dolgozom; a fényképezést nem pusztán eszközhasználatként, hanem figyelemként és önkifejezésként tanítom.',['1999 óta foglalkozom fotográfiával, de számomra a fényképezés soha nem csak szakma volt. Az informatika, a vizuális gondolkodás és az emberi történetek iránti érdeklődés végig együtt alakította a pályámat. 2005-ben informatikai mérnökként végeztem, majd a Magyar Honvédség Híradó és Informatikai Parancsnokságán dokumentációs feladatokon keresztül kerültem közel a professzionális képalkotáshoz. 2006-ban létrehoztam a HIPStudiót, később elvégeztem a New York Institute of Photography képzését, 2018-ban pedig alkalmazott fotográfusi képesítést szereztem. Ma Bécs és Budapest között dolgozom.','Leginkább azok a helyzetek érdekelnek, amikor a kamera előtt valaki már nem szerepelni próbál, hanem egyszerűen jelen van. A portré mellett fontos számomra a társadalmi emlékezet, a diaszpóra, az identitás és az emberi méltóság kérdése. A fotográfiát természetesen kapcsolom össze a technológiával, a tartalomkészítéssel, a webbel és az AI eszközeivel – úgy, hogy közben az ember maradjon a középpontban.','Az óráimon nincs egyetlen „helyes” kép. Inkább azt keresem a résztvevőkkel együtt, hogy ki mit lát, mit akar elmondani, és ehhez milyen technikai döntések segítenek. A célom minden korosztálynál ugyanaz: önállóan gondolkodni, tudatosan használni az eszközöket, és olyan dolgot létrehozni, aminek személyes vagy közösségi értéke van.']),
          'sipos-tibor':(None,None),
          'orban-dalma':('Gyerekkorom óta a Napraforgók közösségéhez tartozom; ma az egyesület elnökhelyettese és a kezdő csoport női táncoktatója vagyok.',['2009-ben, két és fél évesen már színpadra léptem a Napraforgók jubileumi műsorában. Ma az egyesület elnökhelyettese vagyok, és Sipos Tibor munkáját rendszeresen segítve a kezdő csoport női táncoktatójaként dolgozom. Gyerekeket és felnőtt kezdőket is tanítok.','A magyar néptánc, a viseletkultúra, a táncházi közösség és a generációkon át öröklődő hagyomány áll hozzám a legközelebb.','A kezdőkkel az alapoktól dolgozom, és a saját többgenerációs táncos tapasztalatomat igyekszem érthető, követhető tanításba átfordítani. Fontos nekem, hogy a résztvevők ne csak lépéseket tanuljanak, hanem természetes kapcsolatot alakítsanak ki a zenével, a viselettel és a közösségi tánc kultúrájával is.']),
          'egri-monika':('Több évtizedes animációs és illusztrációs tapasztalatomat olyan alkotóműhelyekbe viszem át, ahol a résztvevők a saját képi megoldásaikat kereshetik.',['Animációs rajzfilmrajzolóként kezdtem a pályámat, és mintegy tizennégy éven át dolgoztam animációs produkciókban, többek között a Pumukli kalandjai, a Pettson és Findusz és a Mr Bean animációs sorozat projektjeiben. Dolgoztam nemzetközi filmes produkciókban kellékesként, gyermekmagazin szerkesztőségében, 2010 óta pedig szabadúszó illusztrátorként dolgozom. Több mint harmincöt kiadványban jelentek meg munkáim; 2018-ban saját mesekönyvem is megjelent Állati illemtan címmel.','A gyerekkönyv-illusztráció, az animáció, a humoros vizuális történetmesélés, az akvarell, a pop-up technika, a meseírás és a közös alkotás áll hozzám közel. A rajz és a történet számomra szorosan összetartozik.','A workshopjaimon kifejezetten arra biztatom a résztvevőket, hogy ne az én mintámat másolják, hanem saját megoldást keressenek. Nem várok magas szintű rajztudást: technikát mutatok és segítek, de az egyedi alkotást tartom fontosnak. A ReKreációban ehhez közösségi és környezettudatos szemlélet is társul.']),
          'dapin-hajnalka-judit':(None,None)
          }

          for pid,(role,segs) in R.items():
              if role is None: continue
              pat=r'(<article class="profile" id="'+re.escape(pid)+r'">.*?)(?=<article class="profile" id=|</section>\s*</main>)'
              m=re.search(pat,s,re.S)
              if not m: continue
              b=m.group(1)
              b=re.sub(r'<p class="role">.*?</p>', '<p class="role">'+role+'</p>', b, count=1, flags=re.S)
              b=b.replace('<h3>A hozzá különösen közel álló területek</h3>','<h3>A hozzám különösen közel álló területek</h3>')
              sms=list(re.finditer(r'(<section class="segment">\s*<h3>.*?</h3>\s*<p>)(.*?)(</p>\s*</section>)',b,re.S))
              if segs and len(sms)>=3:
                  for sm,new in reversed(list(zip(sms[:3],segs))):
                      b=b[:sm.start(2)]+new+b[sm.end(2):]
              s=s[:m.start(1)]+b+s[m.end(1):]

          # Balogh's profile uses a richer custom body; at minimum make the visible lead first-person
          # without disturbing its bespoke sections.
          s=re.sub(r'(<article class="profile" id="balogh-david">.*?<p class="role">).*?(</p>)',r'\1A fotográfiát történeti, vizuális és kulturális összefüggéseiben értelmezem. Előadásaimban egy-egy fotográfus vagy korszak munkásságát a történeti háttér, a technika, az érzelmi hatás és a művészeti jelentés felől is vizsgálom, külön figyelemmel a festészet és a fotográfia kapcsolatára.\2',s,count=1,flags=re.S)

          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Unify profile design and first-person human voice"
          git push
