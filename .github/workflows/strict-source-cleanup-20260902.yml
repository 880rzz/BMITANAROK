name: Strict teacher source cleanup 20260902
on:
  push:
    paths:
      - '.github/workflows/strict-source-cleanup-20260902.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy duplicate program UI from source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<div class="programs">.*?</div>','',s,flags=re.S)
          # Remove obsolete visual partner-program section if still present in source.
          s=re.sub(r'<section\b[^>]*>.*?(?:Partnerprogramjaink egy helyen|BMI Partner Programok).*?</section>','',s,flags=re.S|re.I)
          if '<div class="programs">' in s:
              raise SystemExit('Legacy .programs block remains')
          p.write_text(s,encoding='utf-8')
          print(f'removed legacy program blocks: {n}')
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "BMI Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate teacher program blocks from source"
          git push
