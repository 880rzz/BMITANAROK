name: Fix teacher search, Zenebona and Sipos wording 20260902

on:
  push:
    paths:
      - '.github/workflows/fix-teacher-search-zenebona-sipos-20260902.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          js = Path('teacher-search.js')
          css = Path('teacher-search.css')
          s = index.read_text(encoding='utf-8')
          j = js.read_text(encoding='utf-8')
          c = css.read_text(encoding='utf-8')

          # 1) Partner-program registry must load before the teacher search.
          data_tag = '<script src="https://programvalaszto.magyariskola.at/data.js?v=20260902" defer></script>'
          partner_tag = '<script src="https://programvalaszto.magyariskola.at/zenebona-program.js?v=20260902-zenebona-v1" defer></script>'
          if partner_tag not in s:
              if data_tag not in s:
                  raise SystemExit('Program selector data.js script marker missing')
              s = s.replace(data_tag, data_tag + '\n' + partner_tag, 1)

          # 2) Source-level correction for Judit's training timeline.
          bad_judit = 'A zenei és terápiás területek végül a zeneterápiában értek össze számomra; ezt 2025 óta a Bécsi Zeneművészeti Egyetemen tanultam.'
          good_judit = 'A zenei és terápiás területek végül a zeneterápiában értek össze számomra; 2017 óta tanultam zeneterápiát a Bécsi Zeneművészeti Egyetemen, ahol 2025-ben szereztem meg a diplomámat.'
          s = s.replace(bad_judit, good_judit)

          # 3) Restore Sipos Tibor's deliberately composed original third section verbatim.
          current = 'A páros táncot testi empátiának érzem. A gesztusaink folyamatosan egymáshoz igazodnak. Amikor a férfi vezet és a nő követ, a mozdulatok párbeszéddé válnak, de ez a párbeszéd csak akkor él, ha mindkét fél figyel. A figyelem körbeér: vezetés és követés egymásba fordul, ahogy az évszakok is. Ezt a kölcsönös érzékenységet szeretném megtanítani a technika mellett.'
          original = 'A páros tánc testi empátia: gesztusaink egymáshoz igazodnak. Amikor a férfi vezet és a nő követ, a mozdulatok párbeszéddé válnak. A figyelem körbeér, vezetés és követés – mint az évszakok – egymásba fordulnak.'
          if current in s:
              s = s.replace(current, original, 1)
          elif original not in s:
              raise SystemExit('Sipos third-section text not found in expected form')

          # 4) Make teacher identity the primary visual/click target on every result card.
          old_row = "return '<article class=\"ts-card\"><div class=\"ts-person\">'+(r.href?'<a href=\"'+esc(r.href)+'\">'+esc(r.teacher)+'</a>':'<strong>'+esc(r.teacher)+'</strong>')+'</div>'+(p?'<a class=\"ts-program\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(p.name)+'</a><dl><div><dt>Időpont</dt><dd>'+esc(p.when||'Aktuális programoldal szerint')+'</dd></div><div><dt>Helyszín</dt><dd>'+locationHtml+'</dd></div></dl>':'<p class=\"ts-no-program\">A szakmai profil ezen a területen releváns; aktuális kapcsolódó programért nézd meg a Programválasztót.</p>')+'</article>'"
          new_row = "return '<article class=\"ts-card\">'+(r.href?'<a class=\"ts-teacher-link\" href=\"'+esc(r.href)+'\" aria-label=\"'+esc(r.teacher)+' tanári profiljának megnyitása\"><span class=\"ts-teacher-name\">'+esc(r.teacher)+'</span><span class=\"ts-profile-cta\">Tanári profil megnyitása →</span></a>':'<div class=\"ts-teacher-link is-static\"><span class=\"ts-teacher-name\">'+esc(r.teacher)+'</span><span class=\"ts-profile-cta\">Foglalkozásvezető</span></div>')+(p?'<a class=\"ts-program\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(p.name)+'</a><dl><div><dt>Időpont</dt><dd>'+esc(p.when||'Aktuális programoldal szerint')+'</dd></div><div><dt>Helyszín</dt><dd>'+locationHtml+'</dd></div></dl>':'<p class=\"ts-no-program\">A szakmai profil ezen a területen releváns; aktuális kapcsolódó programért nézd meg a Programválasztót.</p>')+'</article>'"
          if old_row not in j:
              if 'ts-profile-cta' not in j:
                  raise SystemExit('Teacher result row renderer marker not found')
          else:
              j = j.replace(old_row, new_row, 1)

          # Search intro explicitly explains the interaction model.
          old_intro = 'Válassz egy területet. Megmutatjuk a kapcsolódó tanárokat és a jelenlegi 2026/27-es foglalkozásokat, időponttal és helyszínnel.'
          new_intro = 'Válassz egy területet. A találatoknál a tanár neve nyitja meg a teljes tanári profilt; alatta külön találod a kapcsolódó 2026/27-es foglalkozást, időpontot és helyszínt.'
          j = j.replace(old_intro, new_intro)

          # 5) Executive/mobile card hierarchy matching the approved screenshot.
          old_css = '.ts-person{font-size:15px;font-weight:700;margin-bottom:6px}.ts-person a{text-decoration:none}.ts-person a:hover{text-decoration:underline}.ts-program{display:block;font-size:17px;font-weight:700;color:#0071e3;text-decoration:none;line-height:1.3;margin-bottom:13px}.ts-program:hover{text-decoration:underline}'
          new_css = '.ts-teacher-link{display:block;margin:-2px -2px 10px;padding:2px;border-radius:8px;color:var(--ink,#1d1d1f);text-decoration:none}.ts-teacher-link:not(.is-static):hover .ts-teacher-name,.ts-teacher-link:not(.is-static):focus-visible .ts-teacher-name{text-decoration:underline;text-underline-offset:3px}.ts-teacher-link:focus-visible{outline:2px solid #0071e3;outline-offset:3px}.ts-teacher-name{display:block;font-size:18px;font-weight:750;line-height:1.25;letter-spacing:-.01em}.ts-profile-cta{display:block;margin-top:4px;color:#0071e3;font-size:12px;font-weight:650;line-height:1.25}.ts-teacher-link.is-static .ts-profile-cta{color:var(--muted,#6e6e73)}.ts-program{display:block;font-size:17px;font-weight:700;color:#2f73da;text-decoration:none;line-height:1.3;margin:0 0 16px}.ts-program:hover,.ts-program:focus-visible{text-decoration:underline;text-underline-offset:3px}'
          if old_css in c:
              c = c.replace(old_css, new_css, 1)
          elif '.ts-teacher-name' not in c:
              c += '\n' + new_css + '\n'

          # Mobile cards should mirror the screenshot: full-width vertical hierarchy.
          c += '\n@media(max-width:640px){.ts-grid{grid-template-columns:1fr;gap:14px}.ts-card{border-radius:20px;padding:22px 20px}.ts-teacher-name{font-size:18px}.ts-profile-cta{font-size:12px}.ts-program{font-size:18px;line-height:1.35;margin-bottom:18px}.ts-card dt{font-size:12px}.ts-card dd{font-size:15px;line-height:1.45}}\n'

          # Cache bust assets so the mobile browser cannot retain the old hierarchy.
          s = re.sub(r'teacher-search\.css\?v=[^\"\']+', 'teacher-search.css?v=20260902-3', s)
          s = re.sub(r'teacher-search\.js\?v=[^\"\']+', 'teacher-search.js?v=20260902-3', s)

          index.write_text(s, encoding='utf-8')
          js.write_text(j, encoding='utf-8')
          css.write_text(c, encoding='utf-8')

          # Regression guards.
          final = index.read_text(encoding='utf-8')
          final_js = js.read_text(encoding='utf-8')
          assert partner_tag in final
          assert final.index(data_tag) < final.index(partner_tag) < final.index('teacher-search.js?v=20260902-3')
          assert original in final
          assert current not in final
          assert good_judit in final
          assert 'ts-profile-cta' in final_js
          assert 'Tanári profil megnyitása' in final_js
          assert 'A találatoknál a tanár neve nyitja meg a teljes tanári profilt' in final_js
          print('OK: Zenebona registry + Sipos original + teacher-primary cards')

      - name: Commit fixes
        run: |
          git config user.name "BMI Teacher UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html teacher-search.js teacher-search.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix Zenebona discovery and teacher-card hierarchy"
          git push
