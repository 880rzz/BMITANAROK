name: Unify BMI school schema id 20260902
on:
  push:
    paths:
      - '.github/workflows/unify-school-schema-id-20260902.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy BMI org id with canonical school id
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','llms-full.txt']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://www.magyariskola.at/#org','https://www.magyariskola.at/#school')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "BMI Schema Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms-full.txt
          git diff --cached --quiet && exit 0
          git commit -m "Unify BMI school schema id with Wix canonical graph"
          git push