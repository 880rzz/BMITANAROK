name: Fix Deakne profile layout

on:
  push:
    paths:
      - '.github/workflows/fix-deakne-profile-layout-20260911.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move profile into shared wrapped profile section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pid = 'deakne-juhasz-eva'
          pat = re.compile(r'<article class="profile" id="' + re.escape(pid) + r'">.*?</article>', re.S)
          matches = list(pat.finditer(s))
          assert len(matches) == 1, f'Expected exactly one {pid} profile, found {len(matches)}'
          article = matches[0].group(0)
          s = s[:matches[0].start()] + s[matches[0].end():]

          main_close = s.rfind('</main>')
          tail_start = s.rfind('<section class="profiles profiles-tail">', 0, main_close)
          wrap_close = s.rfind('</div></section>', tail_start, main_close)
          assert main_close != -1, 'main close marker missing'
          assert tail_start != -1, 'profiles-tail section missing'
          assert wrap_close != -1, 'profiles-tail shared wrap close missing'
          s = s[:wrap_close] + article + '\n' + s[wrap_close:]

          deak_pos = s.find(f'id="{pid}"', tail_start)
          main_close = s.rfind('</main>')
          wrap_close = s.rfind('</div></section>', tail_start, main_close)
          assert tail_start < deak_pos < wrap_close < main_close
          assert s.count(f'id="{pid}"') == 1
          p.write_text(s, encoding='utf-8')

          # Prevent the updater from placing the profile outside the shared wrapper again.
          tool = Path('tools/add_deakne_juhasz_eva_20260911.py')
          if tool.exists():
              t = tool.read_text(encoding='utf-8')
              old = """else:\n    assert '</main>' in s, 'main close marker missing'\n    s = s.replace('</main>', profile + '\\n</main>', 1)"""
              new = """else:\n    main_close = s.rfind('</main>')\n    tail_start = s.rfind('<section class=\"profiles profiles-tail\">', 0, main_close)\n    wrap_close = s.rfind('</div></section>', tail_start, main_close)\n    assert main_close != -1 and tail_start != -1 and wrap_close != -1, 'tail profile wrapper missing'\n    s = s[:wrap_close] + profile + '\\n' + s[wrap_close:]"""
              if old in t:
                  t = t.replace(old, new, 1)
                  tool.write_text(t, encoding='utf-8')
          PY
      - name: Validate shared layout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          pid = 'deakne-juhasz-eva'
          main_close = s.rfind('</main>')
          tail_start = s.rfind('<section class="profiles profiles-tail">', 0, main_close)
          wrap_close = s.rfind('</div></section>', tail_start, main_close)
          deak_pos = s.find(f'id="{pid}"', tail_start)
          poser_pos = s.find('id="poser-piroska-ildiko"', tail_start)
          assert -1 not in (main_close, tail_start, wrap_close, deak_pos, poser_pos)
          assert tail_start < poser_pos < deak_pos < wrap_close < main_close
          assert s.count(f'id="{pid}"') == 1
          print('Layout validation passed: Deakne is inside the same .wrap as the other tail profiles.')
          PY
      - name: Commit fix
        run: |
          git config user.name "BMI Layout Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tools/add_deakne_juhasz_eva_20260911.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Deakne profile container and spacing"
            git push
          fi
