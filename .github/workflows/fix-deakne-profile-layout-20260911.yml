name: Fix Deakne profile layout

on:
  push:
    paths:
      - '.github/workflows/fix-deakne-profile-layout-20260911.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move profile into shared wrapped profile section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pid = 'deakne-juhasz-eva'
          pat = re.compile(r'<article class="profile" id="' + re.escape(pid) + r'">.*?</article>', re.S)
          matches = list(pat.finditer(s))
          assert len(matches) == 1, f'Expected exactly one {pid} profile, found {len(matches)}'
          article = matches[0].group(0)
          s = s[:matches[0].start()] + s[matches[0].end():]

          marker = '</div></section>\n</main>'
          pos = s.rfind(marker)
          assert pos != -1, 'Tail profiles wrapper close marker not found'
          s = s[:pos] + article + '\n' + s[pos:]

          # Structural validation: Deakne must now be inside profiles-tail > .wrap,
          # immediately before that shared wrapper closes.
          tail_start = s.rfind('<section class="profiles profiles-tail">', 0, s.find(f'id="{pid}"'))
          tail_close = s.find('</div></section>', s.find(f'id="{pid}"'))
          main_close = s.find('</main>', s.find(f'id="{pid}"'))
          assert tail_start != -1
          assert tail_close != -1 and tail_close < main_close
          assert s.count(f'id="{pid}"') == 1
          p.write_text(s, encoding='utf-8')

          # Prevent recurrence if the updater is run again.
          tool = Path('tools/add_deakne_juhasz_eva_20260911.py')
          if tool.exists():
              t = tool.read_text(encoding='utf-8')
              old = """else:\n    assert '</main>' in s, 'main close marker missing'\n    s = s.replace('</main>', profile + '\\n</main>', 1)"""
              new = """else:\n    marker = '</div></section>\\n</main>'\n    pos = s.rfind(marker)\n    assert pos != -1, 'tail profile wrapper close marker missing'\n    s = s[:pos] + profile + '\\n' + s[pos:]"""
              if old in t:
                  t = t.replace(old, new, 1)
                  tool.write_text(t, encoding='utf-8')
          PY
      - name: Validate shared layout contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<section class="profiles profiles-tail"><div class="wrap">(.*?)</div></section>\s*</main>', s, re.S)
          assert m, 'profiles-tail wrapped section missing'
          block = m.group(1)
          assert 'id="deakne-juhasz-eva"' in block, 'Deakne profile is not inside the shared wrap'
          assert block.count('id="deakne-juhasz-eva"') == 1
          assert 'id="poser-piroska-ildiko"' in block
          print('Layout validation passed: Deakne now uses the same .wrap/profile typography system as the other tail profiles.')
          PY
      - name: Commit fix
        run: |
          git config user.name "BMI Layout Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tools/add_deakne_juhasz_eva_20260911.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Deakne profile container and spacing"
            git push
          fi
