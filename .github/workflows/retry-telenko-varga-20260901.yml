name: Retry Telenkó Éva and Varga Bernadette update

on:
  push:
    paths:
      - '.github/workflows/retry-telenko-varga-20260901.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse validated profile update script
        shell: python
        run: |
          from pathlib import Path
          import re, textwrap
          src = Path('.github/workflows/update-telenko-varga-20260901.yml').read_text(encoding='utf-8')
          m = re.search(r'- name: Apply first-party profile updates\n\s+shell: python\n\s+run: \|\n(.*?)(?=\n\s+- name: Commit profile updates)', src, re.S)
          if not m:
              raise SystemExit('Profile update script not found')
          code = textwrap.dedent(m.group(1))
          exec(compile(code, 'profile-update', 'exec'))

      - name: Commit and push
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms-full.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update Telenko Eva and Varga Bernadette profiles"
          git pull --rebase origin main
          git push
