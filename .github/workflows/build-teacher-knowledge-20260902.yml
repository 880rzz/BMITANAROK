name: Build teacher knowledge 20260902

on:
  push:
    paths:
      - 'tools/build_teacher_knowledge.py'
      - '.github/workflows/build-teacher-knowledge-20260902.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build teacher knowledge
        run: python3 tools/build_teacher_knowledge.py
      - name: Commit generated knowledge files
        run: |
          git config user.name "BMI Teacher Knowledge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-knowledge.json teacher-catalog.jsonld
          git diff --cached --quiet && exit 0
          git commit -m "Build canonical teacher knowledge graph"
          git push
