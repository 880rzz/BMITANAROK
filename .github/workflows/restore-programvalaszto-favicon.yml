name: Restore Programválasztó favicon

on:
  push:
    paths:
      - '.github/workflows/restore-programvalaszto-favicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the exact Programválasztó favicon
        shell: python
        run: |
          from pathlib import Path
          import re

          replacement = '<link rel="icon" href="/bmi_blue_round_rgb_logo.svg?v=20260901-5" type="image/svg+xml" sizes="any">\n<link rel="shortcut icon" href="/bmi_blue_round_rgb_logo.svg?v=20260901-5" type="image/svg+xml">'
          for name in ['index.html','impresszum.html','adatvedelem.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s, n = re.subn(r'<link rel="icon"[^>]*>\s*<link rel="shortcut icon"[^>]*>', replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'favicon block not found in {name}: {n}')
              p.write_text(s, encoding='utf-8')

          generated = Path('bmi-favicon.svg')
          if generated.exists():
              generated.unlink()

      - name: Commit exact Programválasztó favicon binding
        run: |
          git config user.name "BMI Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use exact Programvalaszto favicon"
          git push
