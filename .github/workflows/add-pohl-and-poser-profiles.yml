name: Add Pohl and Poser profiles

on:
  push:
    paths:
      - '.github/workflows/add-pohl-and-poser-profiles.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profiles and schema
        shell: python
        run: |
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pohl='''<article class="profile" id="pohl-balazs"><div class="profile-head"><figure class="portrait"><span class="fallback">Portré hamarosan</span></figure><div class="profile-title"><div class="eyebrow">Drámapedagógus · SVUNG művészeti vezető</div><h2>Pohl Balázs</h2><p class="role">A Gimi Svung drámafoglalkozás vezetője, ahol a 12–18 éves fiatalok színházi és közösségi munkán keresztül fejlesztik önkifejezésüket.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/gimisvung-2026" target="_blank" rel="noopener">Gimi Svung</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Bécsi Magyar Iskola hivatalos programleírása szerint drámapedagógus, a SVUNG – Bécsi Magyar Színház művészeti vezetője. Színi tanulmányok, filmes, rádiójáték- és szinkronszerepek után a solymári Waldorf-tanárképzésben szerzett osztálytanítói és drámatanári diplomát. Nyolc év Waldorf-iskolai tanítás és diákszínjátszó csoportok vezetése után a képzésben tanárként is dolgozott.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A drámafoglalkozások középpontjában a közös alkotás, a színpadi jelenlét, a kommunikáció és az önkifejezés áll; a munkába időnként a SVUNG társulatának további tagjai is bekapcsolódnak.</p></section></div></article>'''
          poser='''<article class="profile" id="poser-piroska-ildiko"><div class="profile-head"><figure class="portrait"><span class="fallback">Portré hamarosan</span></figure><div class="profile-title"><div class="eyebrow">Csapatparancsnok · 72. sz. Széchenyi István Cserkészcsapat – Bécs</div><h2>Póser-Piroska Ildikó</h2><p class="role">A bécsi magyar cserkészcsapat csapatparancsnoka; közösségi és ifjúsági vezető, nem tanári szerepkörben.</p><div class="programs"><a href="https://programvalaszto.magyariskola.at/foglalkozasok.html#cserkeszet" target="_blank" rel="noopener">Cserkészet | Alliiertenstrasse</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Vezetői háttér</h3><p>A 72. sz. Széchenyi István Cserkészcsapat hivatalos oldala Póser-Piroska Ildikót nevezi meg csapatparancsnokként. A bécsi csapat évtizedek óta a magyar nyelv, kultúra, közösségi felelősség és cserkésznevelés továbbadásán dolgozik.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>Jellemnevelés, közösségépítés, magyar identitás, vezetőképzés, csapatmunka és a gyermekek, fiatalok önállóságának fejlesztése a cserkészet eszközeivel.</p></section></div><section class="press" aria-label="Póser-Piroska Ildikó sajtómegjelenései"><div class="press-head"><span class="eyebrow">Sajtómegjelenések</span><h3>Válogatott sajtóanyagok</h3></div><div class="press-grid"><a class="press-card" href="https://volksgruppen.orf.at/magyarok/stories/3284115/" target="_blank" rel="noopener external"><span class="press-medium">ORF Magyarok · 2025</span><strong>Egyszer cserkész, mindig cserkész</strong><span class="press-desc">Portré és beszélgetés a cserkészet mai jelentőségéről, a jellemnevelésről és a bécsi csapat terveiről.</span><span class="press-open">Cikk megnyitása ↗</span></a><a class="press-card" href="https://volksgruppen.orf.at/magyarok/stories/3282451/" target="_blank" rel="noopener external"><span class="press-medium">ORF Magyarok · 2024</span><strong>Életrevaló fiatalokat nevel a cserkészet</strong><span class="press-desc">Riport a bécsi cserkészek hétvégéjéről, csapatépítésről és vezetői munkáról.</span><span class="press-open">Cikk megnyitása ↗</span></a><a class="press-card" href="https://rolunk.at/magazin/magyar-csaladi-nap-a-becsi-cserkeszekkel/" target="_blank" rel="noopener external"><span class="press-medium">Rólunk.at</span><strong>Magyar családi nap a bécsi cserkészekkel</strong><span class="press-desc">Szerkesztőségi riport a közösségről és a cserkészet nevelő szerepéről.</span><span class="press-open">Cikk megnyitása ↗</span></a></div></section></article>'''
          if 'id="pohl-balazs"' not in s: s=s.replace('</main>',pohl+'\n'+poser+'\n</main>')
          sm=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
          data=json.loads(sm.group(1)); graph=data['@graph']
          ids={x.get('@id') for x in graph if isinstance(x,dict)}
          for slug,name,title in [('pohl-balazs','Pohl Balázs','Drámapedagógus · SVUNG művészeti vezető'),('poser-piroska-ildiko','Póser-Piroska Ildikó','Csapatparancsnok · 72. sz. Széchenyi István Cserkészcsapat – Bécs')]:
              uid=f'https://tanarok.magyariskola.at/#{slug}'
              if uid not in ids: graph.append({'@type':'Person','@id':uid,'name':name,'jobTitle':title,'url':uid,'affiliation':{'@id':'https://www.magyariskola.at/#org'}})
          item=next((x for x in graph if isinstance(x,dict) and x.get('@type')=='ItemList'),None)
          if item:
              els=item.setdefault('itemListElement',[]); existing={e.get('item',{}).get('@id') for e in els}
              for slug in ['pohl-balazs','poser-piroska-ildiko']:
                  uid=f'https://tanarok.magyariskola.at/#{slug}'
                  if uid not in existing: els.append({'@type':'ListItem','position':len(els)+1,'item':{'@id':uid}})
              item['numberOfItems']=len(els)
          s=s[:sm.start(1)]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+s[sm.end(1):]
          p.write_text(s,encoding='utf-8')
          lf=Path('llms-full.txt'); t=lf.read_text(encoding='utf-8')
          insert='- Pohl Balázs — Drámapedagógus · SVUNG művészeti vezető — https://tanarok.magyariskola.at/#pohl-balazs\n- Póser-Piroska Ildikó — Csapatparancsnok · 72. sz. Széchenyi István Cserkészcsapat – Bécs — https://tanarok.magyariskola.at/#poser-piroska-ildiko\n'
          if 'Póser-Piroska Ildikó' not in t: t=t.replace('\n## Entity relationship', '\n'+insert+'\n## Entity relationship')
          lf.write_text(t,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms-full.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add Pohl Balazs and Poser-Piroska Ildiko profiles"
          git push
