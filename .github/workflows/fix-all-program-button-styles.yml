name: Fix all teacher program button styles

on:
  push:
    paths:
      - '.github/workflows/fix-all-program-button-styles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make all related program links visibly button-like
        shell: python
        run: |
          from pathlib import Path
          import re

          css = Path('styles.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* related-program-buttons-20260901 */'
          block = '''\n/* related-program-buttons-20260901 */
.program-links{margin-top:32px}
.program-links>strong{display:block;margin-bottom:12px;font-size:.88rem;letter-spacing:.01em}
.program-link-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,280px));gap:10px 12px;align-items:stretch;justify-content:start}
.program-link-list a,.program-link-list .btn{display:flex!important;align-items:center;justify-content:center;min-height:46px;width:100%;min-width:0;padding:9px 14px;background:var(--soft)!important;color:var(--ink)!important;border:1px solid var(--line)!important;text-decoration:none!important;font-size:.88rem;font-weight:650;text-align:center;line-height:1.35;visibility:visible!important;opacity:1!important}
.program-link-list a:hover{border-color:#999!important;background:#fff!important}
@media(max-width:640px){.program-links{margin-top:28px}.program-link-list{grid-template-columns:1fr}.program-link-list a,.program-link-list .btn{width:100%;min-height:48px}}
'''
          if marker in s:
              s = s[:s.index(marker)].rstrip() + block
          else:
              s += block
          css.write_text(s, encoding='utf-8')

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = re.sub(r'styles\.css\?v=[^\"\']+', 'styles.css?v=20260901-program-buttons-v3', h, count=1)
          # Normalize every link already stored in a related-program block.
          def normalize(m):
              block = m.group(0)
              block = re.sub(r'<a(?![^>]*\bclass=)([^>]*)>', r'<a class="btn ghost"\1>', block)
              block = re.sub(r'class="([^"]*)"', lambda x: 'class="'+(('btn ghost '+x.group(1)).strip() if 'btn' not in x.group(1).split() else x.group(1))+'"', block)
              return block
          h = re.sub(r'<div class="program-links">.*?</div>\s*</div>', normalize, h, flags=re.S)
          p.write_text(h, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix all related program buttons globally"
          git push
