name: Replace BMI favicon

on:
  push:
    paths:
      - '.github/workflows/replace-bmi-favicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old round favicon with current BMI monogram
        shell: python
        run: |
          from pathlib import Path
          import re

          favicon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
          <title id="t">Bécsi Magyar Iskola – BMI</title>
          <desc id="d">Minimal BMI monogram favicon</desc>
          <rect width="128" height="128" rx="24" fill="#ffffff"/>
          <rect x="5" y="5" width="118" height="118" rx="20" fill="none" stroke="#111111" stroke-width="6"/>
          <text x="64" y="77" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" letter-spacing="1" fill="#111111">BMI</text>
          <circle cx="64" cy="96" r="4" fill="#111111"/>
          </svg>'''
          Path('bmi-favicon.svg').write_text(favicon, encoding='utf-8')

          replacement = '<link rel="icon" href="/bmi-favicon.svg?v=20260901-4" type="image/svg+xml" sizes="any">\n<link rel="shortcut icon" href="/bmi-favicon.svg?v=20260901-4" type="image/svg+xml">'
          for name in ['index.html','impresszum.html','adatvedelem.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<link rel="icon"[^>]*>\s*<link rel="shortcut icon"[^>]*>', replacement, s, count=1)
              p.write_text(s, encoding='utf-8')

      - name: Commit favicon replacement
        run: |
          git config user.name "BMI Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bmi-favicon.svg index.html impresszum.html adatvedelem.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace legacy BMI favicon"
          git push
