name: Bind Telenkó Éva portrait

on:
  push:
    paths:
      - '.github/workflows/bind-telenko-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind portrait and schema image
        shell: python
        run: |
          from pathlib import Path
          import re, json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'(<article class="profile" id="telenko-eva">.*?</article>)',s,re.S)
          if not m: raise SystemExit('Telenko profile missing')
          a=m.group(1)
          a=re.sub(r'<figure class="portrait">.*?</figure>','<figure class="portrait"><img src="assets/telenko_eva.webp" alt="Telenkó Éva portréja" loading="lazy" decoding="async"></figure>',a,count=1,flags=re.S)
          s=s[:m.start()]+a+s[m.end():]
          sm=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
          data=json.loads(sm.group(1)); graph=data.get('@graph',[])
          person=next((x for x in graph if x.get('@id','').endswith('#telenko-eva')),None)
          if person: person['image']='https://tanarok.magyariskola.at/assets/telenko_eva.webp'
          s=s[:sm.start(1)]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+s[sm.end(1):]
          p.write_text(s,encoding='utf-8')
          lp=Path('llms-full.txt')
          if lp.exists():
            t=lp.read_text(encoding='utf-8')
            t=re.sub(r'(- Telenkó Éva — .*? — https://tanarok\.magyariskola\.at/#telenko-eva)(?: — portrait: .*?)?$',r'\1 — portrait: https://tanarok.magyariskola.at/assets/telenko_eva.webp',t,flags=re.M)
            lp.write_text(t,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms-full.txt
          git diff --cached --quiet && exit 0
          git commit -m "Bind Telenko Eva portrait"
          git push
