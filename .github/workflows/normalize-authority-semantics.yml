name: Normalize authority relationship semantics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-authority-semantics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize entity graph and resync every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('entity.jsonld'); d=json.loads(p.read_text(encoding='utf-8'))
          for x in d.get('@graph',[]):
              if x.get('@id')=='https://www.becsinaplo.at/#periodical':
                  x.pop('editor',None)
                  x['description']='1980-ban alapított bécsi magyar periodika; a Központi Szövetség kiadványa. Deák Ernő történetileg meghatározó főszerkesztői szerepét külön történeti/életrajzi forrásréteg kezeli, nem időbélyeg nélküli aktuális editor állítás.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          source=p.read_text(encoding='utf-8').strip()
          start='<!-- ecosystem-authority-schema:start -->'; end='<!-- ecosystem-authority-schema:end -->'
          block=f'{start}\n<script type="application/ld+json">\n{source}\n</script>\n{end}'
          for h in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules','vendor'} for x in h.parts): continue
              s=h.read_text(encoding='utf-8')
              if start in s and end in s:
                  a=s.index(start); b=s.index(end,a)+len(end); n=s[:a]+block+s[b:]
              elif '</head>' in s: n=s.replace('</head>',block+'\n</head>',1)
              else: continue
              if n!=s: h.write_text(n,encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ecosystem-schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Bécsi Napló semantics and resync authority schema"
          git push
