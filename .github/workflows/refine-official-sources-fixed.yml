name: Refine official-source teacher profiles fixed

on:
  push:
    paths:
      - '.github/workflows/refine-official-sources-fixed.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified profile corrections
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          articles={
          'balogh-david': '''<article class="profile" id="balogh-david"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Művészettörténész · muzeológus · fotográfiai foglalkozásvezető</div><h2>Balogh Dávid</h2><p class="role">Fóti művészettörténész és muzeológus, aki a fotográfiát történeti, vizuális és kulturális összefüggéseiben is értelmezi.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/fotoklub-2026" target="_blank" rel="noopener">VIPACH Felnőtt Fotóklub</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Művészettörténész és muzeológus, szakmai munkája szorosan kötődik Fóthoz és a helyi kulturális örökséghez. A Németh Kálmán Emlékház vezetőjeként is dolgozott, helytörténeti kutatással, muzeális gyűjteményekkel, tárlatvezetéssel és ismeretterjesztő programokkal foglalkozik. 2024-ben jelent meg A fóti Suum Cuique telep története című kötete.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A művészettörténet, muzeológia, helytörténet, kulturális örökség, kiállításrendezés, vizuális források és a fotográfia történeti értelmezése.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A fotóklubban a képelemzéshez történeti és művészettörténeti nézőpontot is ad. Fontos számára, hogy a résztvevők ne csak technikailag tudjanak egyre biztosabban fényképezni, hanem felismerjék a képi hagyományokat, értsék a vizuális döntések hátterét, és idővel saját, tudatosabb vizuális nyelvet alakítsanak ki.</p></section></div></article>''',
          'pecze-adam': '''<article class="profile" id="pecze-adam"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Zongora · zeneszerzés · musical-foglalkozásvezető</div><h2>Pecze Ádám</h2><p class="role">A Bécsi Magyar Musical Társulat csapatában a zongora és a zeneszerzés területét képviseli, és zenei oldalról kapcsolódik a gyerekek közös színpadi munkájához.</p><div class="programs"><a href="https://www.magyariskola.at/event-details/mammut-2026" target="_blank" rel="noopener">MaMUT Musical Stúdió</a><a href="https://www.musicaltarsulat.at/" target="_blank" rel="noopener">Bécsi Magyar Musical Társulat</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Bécsi Magyar Musical Társulat hivatalos bemutatkozása zongora és zeneszerzés szerepkörben tünteti fel. A MaMUT Musical Stúdióban a zenei munka oldaláról vesz részt a közös alkotásban.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A zongora, a zeneszerzés, a musical zenei világa és az a folyamat, amelyben a dallam, a ritmus és a színpadi történet egymást erősíti.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A musicalműhelyben a zene nem különálló kíséret, hanem a közös előadás része. A zongorás és zeneszerzői munka segíti a gyerekeket abban, hogy a ritmust, a dallamot, a szöveget és a színpadi jelenlétet egységben tapasztalják meg.</p></section></div></article>''',
          'sipos-tibor': '''<article class="profile" id="sipos-tibor"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptánc-foglalkozásvezető · Napraforgók</div><h2>Sipos Tibor</h2><p class="role">A Napraforgók Bécsi Magyar Néptánc és Népzene Egyesület kezdő csoportjának vezetője, Orbán Dalmával közösen.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#kezdocsoport" target="_blank" rel="noopener">Kezdő néptánc felnőtteknek</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Napraforgók Bécsi Magyar Néptánc és Népzene Egyesület kezdő csoportját Orbán Dalmával közösen vezeti. A csoport próbái a Bécsi Magyar Iskolában zajlanak, és olyan felnőtteknek szólnak, akik az első lépésektől szeretnének megismerkedni a magyar néptánccal.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc, a táncház, a hagyományőrzés és a kezdők fokozatos bevezetése a különböző tájegységek táncanyagába.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A kezdő csoport kortól, nemtől és előzetes tánctudástól függetlenül várja a résztvevőket. A tanulás az alapoktól indul, közösségi tempóban; a cél, hogy a résztvevők biztonságosan és örömmel lépjenek be a magyar néptánc világába.</p></section></div></article>''',
          'orban-dalma': '''<article class="profile" id="orban-dalma"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Néptáncoktató · Napraforgók elnökhelyettese</div><h2>Orbán Dalma</h2><p class="role">A Napraforgók egyik legrégebbi fiatal táncosa, ma az egyesület elnökhelyettese és a kezdő csoport női táncoktatója.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#kezdocsoport" target="_blank" rel="noopener">Kezdő néptánc felnőtteknek</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Gyerekkora óta a Napraforgók közösségéhez tartozik: 2009-ben, két és fél évesen már színpadra lépett az együttes jubileumi műsorában. Ma a Napraforgók elnökhelyettese, és Sipos Tibor munkáját rendszeresen segítve a kezdő csoport női táncoktatója. Tánctudását gyermekek és felnőtt kezdők tanításában egyaránt kamatoztatja.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A magyar néptánc, a viseletkultúra, a táncházi közösség és a generációkon át öröklődő hagyomány.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A kezdőkkel az alapoktól dolgozik, és saját többgenerációs táncos tapasztalatát fordítja át érthető, követhető tanításba. Fontos számára, hogy a résztvevők ne csak lépéseket tanuljanak, hanem természetes kapcsolatot alakítsanak ki a zenével, a viselettel és a közösségi tánc kultúrájával is.</p></section></div></article>''',
          'varga-bernadette': '''<article class="profile" id="varga-bernadette"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó helye</span></figure><div class="profile-title"><div class="eyebrow">Gyermek-néptáncoktató · népzenész · Napraforgók</div><h2>Varga Bernadette</h2><p class="role">Veres Tamással közösen vezeti a Napraforgócskák gyermekcsoportot, és a gyerekek saját házi zenekarában brácsán is közreműködik.</p><div class="programs"><a href="https://napraforgok.at/r%C3%B3lunk#napraforgocskak" target="_blank" rel="noopener">Napraforgócskák</a></div></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A Napraforgók Bécsi Magyar Néptánc és Népzene Egyesület tagja, 2023 óta Veres Tamással közösen vezeti a Napraforgócskák gyermekcsoportot. A csoportban mintegy húsz bécsi és Bécs környéki gyermek táncol rendszeresen. A saját házi zenekarban Varga Bernadette brácsán kíséri a gyerekeket.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A gyermek-néptáncoktatás, a magyar népzene, a felcsíki és más tájegységek táncanyaga, a népdal, a csujjogatás és az élő zenei kíséret.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A Napraforgócskákban a gyerekek játékosan, mégis komolyan ismerkednek a magyar néptánccal, zenével és hagyományokkal. A rendszeres próbák, a közös fellépések és az élő zene együtt teszik a hagyományt személyes, közösségi élménnyé.</p></section></div></article>'''
          }
          for aid, html in articles.items():
              s,n=re.subn(rf'<article class="profile" id="{re.escape(aid)}">.*?</article>', html, s, count=1, flags=re.S)
              if n!=1: raise SystemExit(f'profile {aid}: {n} matches')
          replacements=[
            ('<a class="teacher-card" href="#sipos-tibor"><b>Sipos Tibor</b><span>Felnőtt néptánc · hagyományőrzés</span></a>','<a class="teacher-card" href="#sipos-tibor"><b>Sipos Tibor</b><span>Napraforgók · kezdő felnőtt néptánc</span></a>'),
            ('<a class="teacher-card" href="#orban-dalma"><b>Orbán Dalma</b><span>Néptánc · táborvezetés · kezdő csoport</span></a>','<a class="teacher-card" href="#orban-dalma"><b>Orbán Dalma</b><span>Napraforgók · néptáncoktatás · kezdő csoport</span></a>'),
            ('<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>Gyermek néptánc · népzene · közösség</span></a>','<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>Napraforgók · gyermek néptánc · népzene</span></a>')
          ]
          for a,b in replacements: s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Teacher Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align Balogh, Pecze and Napraforgok profiles with official sources"
          git push
