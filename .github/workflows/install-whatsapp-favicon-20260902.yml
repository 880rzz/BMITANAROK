name: Install WhatsApp and favicon 20260902

on:
  push:
    paths:
      - '.github/workflows/install-whatsapp-favicon-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=['index.html','impresszum.html','adatvedelem.html']
          fav='<link rel="icon" href="https://programvalaszto.magyariskola.at/bmi-butterfly-favicon.png?v=20260902" type="image/png">'
          script='<script src="whatsapp-widget.js?v=20260902-whatsapp-v1"></script>'
          for fn in pages:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<link\s+rel="icon"[^>]*>',fav,s,count=1,flags=re.I)
              if fav not in s:
                  s=s.replace('</head>',fav+'\n</head>',1)
              s=re.sub(r'<link\s+rel="shortcut icon"[^>]*>','',s,flags=re.I)
              if 'whatsapp-widget.js' not in s:
                  s=s.replace('</body>',script+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          for fn in ['index.html','impresszum.html','adatvedelem.html']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              assert 'bmi-butterfly-favicon.png?v=20260902' in s, fn+' favicon missing'
              assert 'whatsapp-widget.js?v=20260902-whatsapp-v1' in s, fn+' whatsapp missing'
          print('WhatsApp + favicon references OK')
      - name: Commit
        run: |
          git config user.name "BMI Teacher UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html impresszum.html adatvedelem.html
          git diff --cached --quiet && exit 0
          git commit -m "Match Programvalaszto WhatsApp and favicon"
          git push
