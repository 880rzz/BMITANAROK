name: Update Telenkó Éva and Varga Bernadette profiles

on:
  push:
    paths:
      - '.github/workflows/update-telenko-varga-20260901.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply first-party profile updates
        shell: python
        run: |
          from pathlib import Path
          import re, json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # ----- Varga Bernadette -----
          m = re.search(r'(<article class="profile" id="varga-bernadette">.*?</article>)', s, re.S)
          if not m:
              raise SystemExit('Varga Bernadette profile not found')
          old = m.group(1)
          press = re.search(r'<section class="press".*?</section>', old, re.S)
          press_html = press.group(0) if press else ''
          actions = re.search(r'<div class="actions">.*?</div>', old, re.S)
          actions_html = actions.group(0) if actions else ''

          varga = '''<article class="profile" id="varga-bernadette"><div class="profile-head"><figure class="portrait"><img src="assets/bernadett.webp" alt="Varga Bernadette portréja" loading="lazy" decoding="async"></figure><div class="profile-title"><div class="eyebrow">Dipl.-Ing. · gyermek-néptánc-foglalkozásvezető · Napraforgócskák</div><h2>Varga Bernadette</h2><p class="role">A Napraforgócskák gyerektánccsoportot Veres Tamással vezeti. Külföldön született magyarként a magyar nyelv, néptánc, népzene és közösség továbbadását személyes ügyének tekinti; a gyerekekkel végzett néptáncos munkát önkéntesen végzi mérnöki főállása mellett.</p>''' + actions_html + '''</div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>A TU Wien egyetemen Bauingenieurwesen szakon végzett, hivatalos titulusa Dipl.-Ing. Teljes állásban projektvezető statikusként dolgozik. A néptánc gyermekkora óta része az életének: már óvodásként táncházakba járt, később a cserkészetben sokat foglalkozott gyerekekkel, és több, gyermekcsoportok vezetésére felkészítő vezetői képzést is elvégzett. Az egyesületben az elmúlt években intenzíven táncol, és ennek természetes folytatásaként vezeti a Napraforgócskák gyerektánccsoportját.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A gyerekekkel való foglalkozás, a néptánc, a népzene, a játékos oktatás és a közösségformálás áll hozzá a legközelebb. Fontos számára, hogy a gyerekek magyar énekeket, népi játékokat és táncokat tanuljanak, miközben fejlődik a ritmusérzékük, a szókincsük és a magyar közösséghez való kötődésük.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>Abból a személyes tapasztalatból indul ki, hogy a hagyomány csak akkor marad élő, ha a következő generáció ténylegesen használja és megéli. Kallós Zoltán gondolatával azonosul: „Addig leszünk magyarok, míg magyarul énekelünk és magyarul táncolunk.” A foglalkozásokon ezért a néptánc és a népzene megismerése mellett minden alkalommal helyet kap a játék is. A cél nem elsősorban a fellépés, hanem az, hogy a gyerekek számára természetessé váljon a magyar kulturális közeg, és erős közösségi élménnyel kapcsolódjanak hozzá.</p></section></div>''' + press_html + '''</article>'''
          s = s[:m.start()] + varga + s[m.end():]

          # Update teacher card text.
          s = re.sub(r'<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>.*?</span></a>', '<a class="teacher-card" href="#varga-bernadette"><b>Varga Bernadette</b><span>Napraforgócskák · gyermek néptánc · népzene</span></a>', s, count=1)

          # ----- Telenkó Éva -----
          if 'id="telenko-eva"' not in s:
              card = '<a class="teacher-card" href="#telenko-eva"><b>Telenkó Éva</b><span>Mozgásfejlesztés · gyermekjóga · Brain Gym®</span></a>\n'
              marker = '<a class="teacher-card" href="#varga-bernadette">'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('Teacher-card insertion marker not found')
              s = s[:pos] + card + s[pos:]

              profile = '''<article class="profile" id="telenko-eva"><div class="profile-head"><figure class="portrait"><span class="fallback" style="z-index:1">Fotó hamarosan</span></figure><div class="profile-title"><div class="eyebrow">Mozgás- és képességfejlesztő · kisgyermeknevelő · gyermekjóga- és Brain Gym®-oktató</div><h2>Telenkó Éva</h2><p class="role">Több mint 15 éve foglalkozik gyermekekkel a hat hónapos kortól a kisiskolás korosztályig. A mozgást, a játékot és a közös felfedezést olyan alapnak tekinti, amelyen keresztül a gyerekek nemcsak tanulnak, hanem saját képességeiket és érzéseiket is egyre tudatosabban ismerik meg.</p></div></div><div class="bio-segments"><section class="segment"><h3>Szakmai háttér és legfontosabb tapasztalatok</h3><p>Tanulmányait fejlesztőpedagógiai, mozgásfejlesztési és gyermekjóga területen végezte, emellett Brain Gym®-oktatóként is alkalmazza a megszerzett tudást. Pedagógiai gondolkodására a Waldorf-szemlélet is hatással van. Magyarországon integrált bölcsődei és óvodai csoportban csoportvezetőként szerzett tapasztalatot, jelenleg egy badeni önkormányzati óvodában dolgozik. A Bécsi Magyar Iskolában hat éve tart óvodás foglalkozásokat és táborokat.</p></section><section class="segment"><h3>A hozzá különösen közel álló területek</h3><p>A mozgás- és képességfejlesztés, a szabad és kreatív játék, a gyermekjóga, a Brain Gym®, valamint a gyermekek érzelmi önkifejezésének támogatása áll hozzá különösen közel. Fontos számára a Waldorf-pedagógia holisztikus szemlélete, amely a gyermeket a maga teljességében látja, és teret ad az egyéni kibontakozásnak.</p></section><section class="segment"><h3>Pedagógiai szemlélet</h3><p>A gyerekekkel való foglalkozást mindenekelőtt kapcsolatnak, játéknak és közös felfedezésnek tekinti. Olyan biztonságos és inspiráló közeget szeretne teremteni, ahol a gyermek önmaga lehet, bátran próbálkozhat, örömmel mozoghat, és saját élményként élheti meg a „meg tudom csinálni, mert képes vagyok rá” érzését.</p></section></div></article>'''
              prof_marker = '<article class="profile" id="varga-bernadette">'
              pos = s.find(prof_marker)
              if pos < 0:
                  raise SystemExit('Profile insertion marker not found')
              s = s[:pos] + profile + '\n' + s[pos:]

          # ----- JSON-LD graph -----
          sm = re.search(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
          if not sm:
              raise SystemExit('JSON-LD not found')
          data = json.loads(sm.group(1))
          graph = data.get('@graph', [])
          itemlist = next((x for x in graph if x.get('@type') == 'ItemList' and x.get('@id','').endswith('#teachers')), None)
          if itemlist:
              elems = itemlist.get('itemListElement', [])
              tid = 'https://tanarok.magyariskola.at/#telenko-eva'
              if not any(e.get('item',{}).get('@id') == tid for e in elems):
                  insert_at = next((i for i,e in enumerate(elems) if e.get('item',{}).get('@id','').endswith('#varga-bernadette')), len(elems))
                  elems.insert(insert_at, {'@type':'ListItem','position': insert_at+1,'item':{'@id':tid}})
              for i,e in enumerate(elems, 1): e['position'] = i
              itemlist['numberOfItems'] = len(elems)
              itemlist['itemListElement'] = elems

          person = next((x for x in graph if x.get('@id','').endswith('#varga-bernadette')), None)
          if person:
              person['jobTitle'] = 'Dipl.-Ing. · gyermek-néptánc-foglalkozásvezető · Napraforgócskák'
          tid = 'https://tanarok.magyariskola.at/#telenko-eva'
          if not any(x.get('@id') == tid for x in graph):
              graph.append({'@type':'Person','@id':tid,'name':'Telenkó Éva','jobTitle':'Mozgás- és képességfejlesztő · kisgyermeknevelő · gyermekjóga- és Brain Gym®-oktató','url':tid,'affiliation':{'@id':'https://www.magyariskola.at/#org'},'worksFor':{'@id':'https://www.magyariskola.at/#org'}})
          data['@graph'] = graph
          s = s[:sm.start(1)] + json.dumps(data, ensure_ascii=False, separators=(',',':')) + s[sm.end(1):]
          p.write_text(s, encoding='utf-8')

          # ----- LLM index -----
          lp = Path('llms-full.txt')
          if lp.exists():
              t = lp.read_text(encoding='utf-8')
              t = re.sub(r'- Varga Bernadette — .*? — https://tanarok\.magyariskola\.at/#varga-bernadette — portrait: .*', '- Varga Bernadette — Dipl.-Ing. · gyermek-néptánc-foglalkozásvezető · Napraforgócskák — https://tanarok.magyariskola.at/#varga-bernadette — portrait: https://tanarok.magyariskola.at/assets/bernadett.webp', t)
              if 'Telenkó Éva' not in t:
                  marker = '- Varga Bernadette —'
                  pos = t.find(marker)
                  line = '- Telenkó Éva — Mozgás- és képességfejlesztő · kisgyermeknevelő · gyermekjóga- és Brain Gym®-oktató — https://tanarok.magyariskola.at/#telenko-eva\n'
                  t = t[:pos] + line + t[pos:] if pos >= 0 else t + '\n' + line
              lp.write_text(t, encoding='utf-8')

      - name: Commit profile updates
        run: |
          git config user.name "BMI Teacher Profile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms-full.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update Telenko Eva and Varga Bernadette profiles"
          git push
